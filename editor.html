<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arzi — Write Freely</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Arial&family=Georgia&family=Caveat:wght@500;600&family=Dancing+Script:wght@500;600&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Sacramento&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">

<style>
  body { background: var(--paper); }

  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--paper-raised);
    flex-wrap: wrap;
    gap: 0.75rem;
  }

  .back-link {
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-decoration: none;
  }
  .back-link:hover { color: var(--maroon); }

  .export-actions { display: flex; gap: 0.6rem; }

  .btn {
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.55rem 1rem;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary {
    background: var(--maroon);
    border-color: var(--maroon);
    color: var(--paper-raised);
  }
  .btn.primary:hover { background: var(--maroon-deep); }
  .btn:hover { border-color: var(--brass); }

  .editor-shell {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem 3rem;
  }

  .page {
    width: 100%;
    max-width: 720px;
  }

  #toolbar {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-bottom: none;
    border-radius: 4px 4px 0 0;
  }

  #editor-body {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 0 0 4px 4px;
    min-height: 500px;
    font-size: 1rem;
    line-height: 1.6;
  }

  .ql-editor { min-height: 500px; padding: 2.25rem; font-family: var(--font-display); }
  .ql-editor.ql-blank::before { font-style: normal; color: #9a9488; }

  /* Font family options */
  .ql-font-arial { font-family: Arial, sans-serif; }
  .ql-font-georgia { font-family: Georgia, serif; }
  .ql-font-lora { font-family: 'Lora', serif; }
  .ql-font-playfair { font-family: 'Playfair Display', serif; }
  .ql-font-caveat { font-family: 'Caveat', cursive; }
  .ql-font-dancing { font-family: 'Dancing Script', cursive; }
  .ql-font-kalam { font-family: 'Kalam', cursive; }
  .ql-font-shadows { font-family: 'Shadows Into Light', cursive; }
  .ql-font-sacramento { font-family: 'Sacramento', cursive; }

  .ql-picker.ql-font .ql-picker-label[data-value="caveat"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="caveat"]::before { content: 'Caveat (handwriting)'; font-family: 'Caveat', cursive; }
  .ql-picker.ql-font .ql-picker-label[data-value="dancing"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="dancing"]::before { content: 'Dancing Script (handwriting)'; font-family: 'Dancing Script', cursive; }
  .ql-picker.ql-font .ql-picker-label[data-value="kalam"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="kalam"]::before { content: 'Kalam (handwriting)'; font-family: 'Kalam', cursive; }
  .ql-picker.ql-font .ql-picker-label[data-value="shadows"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="shadows"]::before { content: 'Shadows Into Light (handwriting)'; font-family: 'Shadows Into Light', cursive; }
  .ql-picker.ql-font .ql-picker-label[data-value="sacramento"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="sacramento"]::before { content: 'Sacramento (handwriting)'; font-family: 'Sacramento', cursive; }
  .ql-picker.ql-font .ql-picker-label[data-value="georgia"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="georgia"]::before { content: 'Georgia'; }
  .ql-picker.ql-font .ql-picker-label[data-value="arial"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="arial"]::before { content: 'Arial'; }
  .ql-picker.ql-font .ql-picker-label[data-value="lora"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="lora"]::before { content: 'Lora'; }
  .ql-picker.ql-font .ql-picker-label[data-value="playfair"]::before,
  .ql-picker.ql-font .ql-picker-item[data-value="playfair"]::before { content: 'Playfair Display'; }

  .ql-size-small { font-size: 0.75rem; }
  .ql-size-normal { font-size: 1rem; }
  .ql-size-large { font-size: 1.5rem; }
  .ql-size-huge { font-size: 2.2rem; }

  #status {
    text-align: center;
    font-size: 0.8rem;
    color: var(--ink-soft);
    padding-top: 0.5rem;
  }
</style>
</head>
<body>

  <div class="editor-header">
    <a class="back-link" href="index.html">&larr; Back</a>
    <div class="export-actions">
      <button class="btn" id="export-image">Save as Image</button>
      <button class="btn primary" id="export-pdf">Save as PDF</button>
    </div>
  </div>

  <div class="editor-shell">
    <div class="page">
      <div id="toolbar">
        <span class="ql-formats">
          <select class="ql-font">
            <option value="lora" selected>Lora</option>
            <option value="arial">Arial</option>
            <option value="georgia">Georgia</option>
            <option value="playfair">Playfair Display</option>
            <option value="caveat">Caveat</option>
            <option value="dancing">Dancing Script</option>
            <option value="kalam">Kalam</option>
            <option value="shadows">Shadows Into Light</option>
            <option value="sacramento">Sacramento</option>
          </select>
          <select class="ql-size">
            <option value="small">Small</option>
            <option value="normal" selected>Normal</option>
            <option value="large">Large</option>
            <option value="huge">Huge</option>
          </select>
        </span>
        <span class="ql-formats">
          <button class="ql-bold"></button>
          <button class="ql-italic"></button>
          <button class="ql-underline"></button>
          <button class="ql-strike"></button>
        </span>
        <span class="ql-formats">
          <select class="ql-color"></select>
          <select class="ql-background"></select>
        </span>
        <span class="ql-formats">
          <button class="ql-align" value=""></button>
          <button class="ql-align" value="center"></button>
          <button class="ql-align" value="right"></button>
          <button class="ql-align" value="justify"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-indent" value="-1"></button>
          <button class="ql-indent" value="+1"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-list" value="ordered"></button>
          <button class="ql-list" value="bullet"></button>
        </span>
        <span class="ql-formats">
          <button class="ql-clean"></button>
        </span>
      </div>
      <div id="editor-body"></div>
      <div id="status"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const Font = Quill.import('formats/font');
    Font.whitelist = ['arial', 'georgia', 'lora', 'playfair', 'caveat', 'dancing', 'kalam', 'shadows', 'sacramento'];
    Quill.register(Font, true);

    const Size = Quill.import('formats/size');
    Size.whitelist = ['small', 'normal', 'large', 'huge'];
    Quill.register(Size, true);

    const quill = new Quill('#editor-body', {
      theme: 'snow',
      modules: { toolbar: '#toolbar' },
      placeholder: 'Start writing your application here…'
    });

    async function exportAs(type) {
      const status = document.getElementById('status');
      status.textContent = 'Preparing export…';
      const target = document.querySelector('#editor-body .ql-editor');

      const canvas = await html2canvas(target, { scale: 2, backgroundColor: '#ffffff' });

      if (type === 'image') {
        const link = document.createElement('a');
        link.download = 'application.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const imgWidth = pageWidth - 72;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        const img = canvas.toDataURL('image/png');

        let remaining = imgHeight;
        let position = 36;
        pdf.addImage(img, 'PNG', 36, position, imgWidth, imgHeight);

        // Basic multi-page handling for long documents
        remaining -= (pageHeight - 72);
        while (remaining > 0) {
          pdf.addPage();
          position = -(imgHeight - remaining) - 36;
          pdf.addImage(img, 'PNG', 36, position, imgWidth, imgHeight);
          remaining -= (pageHeight - 72);
        }
        pdf.save('application.pdf');
      }
      status.textContent = '';
    }

    document.getElementById('export-image').addEventListener('click', () => exportAs('image'));
    document.getElementById('export-pdf').addEventListener('click', () => exportAs('pdf'));
  </script>

</body>
</html>
