<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arzi — Leave Application</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  body { background: var(--paper); }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--paper-raised);
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .back-link { font-size: 0.85rem; color: var(--ink-soft); text-decoration: none; }
  .back-link:hover { color: var(--maroon); }

  .export-actions { display: flex; gap: 0.6rem; }
  .btn {
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.55rem 1rem;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--maroon); border-color: var(--maroon); color: var(--paper-raised); }
  .btn.primary:hover { background: var(--maroon-deep); }
  .btn:hover { border-color: var(--brass); }

  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    padding: 1.75rem 1.25rem 3rem;
    max-width: 1180px;
    margin: 0 auto;
  }

  .form-pane {
    flex: 1 1 360px;
    min-width: 320px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.25rem;
  }

  .field-group { margin-bottom: 1.1rem; }
  .field-group label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 0.3rem;
  }
  .field-group select,
  .field-group input[type="text"],
  .field-group input[type="date"],
  .field-group input[type="number"],
  .field-group textarea {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    background: #fff;
    color: var(--ink);
  }
  .field-group textarea { resize: vertical; min-height: 3rem; }
  .field-row { display: flex; gap: 0.75rem; }
  .field-row > div { flex: 1; }

  .section-label {
    font-family: var(--font-display);
    font-size: 1.05rem;
    color: var(--maroon);
    margin: 0 0 0.9rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--line-soft);
  }

  .sig-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .sig-tab {
    font-family: var(--font-body);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    border-radius: 4px;
    cursor: pointer;
  }
  .sig-tab.active { background: var(--maroon); border-color: var(--maroon); color: #fff; }

  .sig-tab-panel { margin-bottom: 0.75rem; }
  .sig-tab-panel input[type="file"] { font-size: 0.85rem; }

  #sigVideo { width: 100%; max-height: 220px; background: #111; border-radius: 4px; display: block; }
  .sig-scan-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

  .sig-hint { font-size: 0.75rem; color: var(--ink-soft); margin: 0.3rem 0; }

  .sig-crop-container {
    position: relative;
    max-width: 100%;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 16px 16px;
    user-select: none;
  }
  .sig-crop-container img { display: block; max-width: 100%; }
  .sig-crop-rect {
    position: absolute;
    border: 2px dashed var(--maroon);
    background: rgba(122,35,49,0.12);
    display: none;
  }

  .sig-checkbox { display: block; font-size: 0.8rem; color: var(--ink-soft); margin: 0.5rem 0; }

  .sig-current {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }
  .sig-preview {
    width: 110px;
    height: 50px;
    border: 1px dashed var(--line);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 0.68rem;
    color: var(--ink-soft);
    background: #fff;
    flex-shrink: 0;
  }
  .sig-preview img { max-width: 100%; max-height: 100%; }

  .sig-library {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .sig-lib-item {
    position: relative;
    width: 72px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sig-lib-item.selected { border-color: var(--maroon); box-shadow: 0 0 0 2px rgba(122,35,49,0.2); }
  .sig-lib-item img { max-width: 100%; max-height: 100%; }
  .sig-lib-remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--maroon);
    color: #fff;
    font-size: 0.65rem;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    border: none;
  }

  .preview-pane {
    flex: 1 1 420px;
    min-width: 320px;
  }

  .paper {
    background: #ffffff;
    border: 1px solid var(--line);
    box-shadow: 0 12px 26px -16px rgba(35,40,58,0.3);
    padding: 2.5rem 2.25rem;
    min-height: 640px;
    font-family: var(--font-display);
    font-size: 0.98rem;
    line-height: 1.75;
    color: var(--ink);
  }
  .paper p { margin: 0 0 0.9rem; }
  .paper .subject { font-weight: 600; }
  .paper .sig-line { margin-top: 0.5rem; }
  .paper .sig-img { max-height: 55px; max-width: 160px; display: block; margin-bottom: 0.2rem; }
  .paper .copy-block { margin-top: 1.6rem; font-size: 0.9rem; }
  .paper table.formI { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .paper table.formI td { border: 1px solid #999; padding: 0.4rem 0.5rem; vertical-align: top; }
  .paper table.formI td.num { width: 2.2rem; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
  }
</style>
</head>
<body>

  <div class="app-header">
    <a class="back-link" href="index.html">&larr; Back</a>
    <div class="export-actions">
      <button class="btn" id="export-image">Save as Image</button>
      <button class="btn primary" id="export-pdf">Save as PDF</button>
    </div>
  </div>

  <div class="layout">

    <div class="form-pane">
      <h2 class="section-label">Leave details</h2>

      <div class="field-group">
        <label for="leaveType">Leave type</label>
        <select id="leaveType">
          <option value="casual1">Casual Leave — One Day</option>
          <option value="casualN">Casual Leave — Multiple Days</option>
          <option value="halfday">Half-Day Casual Leave</option>
          <option value="stationLeave">Casual Leave (with permission to leave Station)</option>
          <option value="earnedLetter">Earned Leave — Letter format</option>
          <option value="earnedFormI">Earned Leave — Form I (Official)</option>
          <option value="joining">Joining Report (after leave)</option>
        </select>
      </div>

      <div class="field-group" id="dateFieldsSingle">
        <label for="dateSingle">Date</label>
        <input type="date" id="dateSingle">
      </div>

      <div class="field-group" id="dateFieldsRange" style="display:none;">
        <div class="field-row">
          <div>
            <label for="dateFrom">From</label>
            <input type="date" id="dateFrom">
          </div>
          <div>
            <label for="dateTo">To</label>
            <input type="date" id="dateTo">
          </div>
        </div>
      </div>

      <div class="field-group" id="numDaysField" style="display:none;">
        <label for="numDays">Number of days</label>
        <input type="number" id="numDays" min="2" value="2">
      </div>

      <div class="field-group" id="sessionField" style="display:none;">
        <label for="session">Session</label>
        <select id="session">
          <option value="Morning">Morning session (first half)</option>
          <option value="Evening">Evening session (second half)</option>
        </select>
      </div>

      <div class="field-group" id="stationField" style="display:none;">
        <label for="stationNote">Note (leave-station permission is added to the subject line automatically)</label>
      </div>

      <div class="field-group" id="reasonField">
        <label for="reasonPreset">Reason</label>
        <select id="reasonPreset">
          <option value="personal emergency">Personal emergency</option>
          <option value="unforeseen circumstances">Unforeseen circumstances</option>
          <option value="an urgent work">Urgent work</option>
          <option value="an unavoidable urgency">Unavoidable urgency</option>
          <option value="a medical appointment">Medical appointment</option>
          <option value="the sudden bereavement in my family">Sudden bereavement</option>
          <option value="the requirement to appear as a witness in a court case">Witness in a court case</option>
          <option value="custom">Other (type your own)</option>
        </select>
      </div>

      <div class="field-group" id="reasonCustomField" style="display:none;">
        <label for="reasonCustom">Custom reason</label>
        <textarea id="reasonCustom" placeholder="Type the reason exactly as it should appear"></textarea>
      </div>

      <div class="field-group" id="durationField" style="display:none;">
        <label for="duration">Duration</label>
        <input type="text" id="duration" placeholder="e.g. one month / 30 days">
      </div>

      <h2 class="section-label" style="margin-top:1.5rem;">Addressed to</h2>
      <div class="field-group">
        <label for="addresseePreset">Addressee</label>
        <select id="addresseePreset">
          <option value="director">The Director Litigation, Kashmir</option>
          <option value="principal">The Principal, Government Medical College, Handwara</option>
          <option value="custom">Other (type your own)</option>
        </select>
      </div>
      <div class="field-group" id="addresseeCustomField" style="display:none;">
        <label for="addresseeCustom">Custom addressee (one line per line)</label>
        <textarea id="addresseeCustom" placeholder="The [Designation],&#10;[Office],&#10;[Place]."></textarea>
      </div>

      <h2 class="section-label" style="margin-top:1.5rem;">Your details</h2>

      <div class="field-group">
        <label for="applicantName">Full name</label>
        <input type="text" id="applicantName" placeholder="e.g. Farooq Ahmad Payer">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="designationPreset">Designation</label>
          <select id="designationPreset">
            <option value="MTS">MTS</option>
            <option value="Jr. Asst">Jr. Asst</option>
            <option value="Sr. Asst">Sr. Asst</option>
            <option value="District Litigation Officer">District Litigation Officer</option>
            <option value="custom">Other</option>
          </select>
        </div>
        <div class="field-group">
          <label for="attendanceId">Attendance ID (optional)</label>
          <input type="text" id="attendanceId" placeholder="e.g. 63907072 — leave blank to omit">
        </div>
      </div>
      <div class="field-group" id="designationCustomField" style="display:none;">
        <label for="designationCustom">Custom designation</label>
        <input type="text" id="designationCustom">
      </div>

      <div class="field-group">
        <label for="copyTo">Copy to (one per line)</label>
        <textarea id="copyTo">1. District Litigation Officer, Kupwara for information.</textarea>
      </div>

      <div class="field-group">
        <label>Signature</label>

        <div class="sig-tabs">
          <button type="button" class="sig-tab active" data-tab="upload">Upload</button>
          <button type="button" class="sig-tab" data-tab="scan">Scan (camera)</button>
        </div>

        <div class="sig-tab-panel" id="sigPanelUpload">
          <input type="file" id="sigUpload" accept="image/*">
        </div>

        <div class="sig-tab-panel" id="sigPanelScan" style="display:none;">
          <video id="sigVideo" autoplay playsinline></video>
          <div class="sig-scan-actions">
            <button type="button" class="btn" id="sigStartCam">Start camera</button>
            <button type="button" class="btn" id="sigCapture" disabled>Capture frame</button>
          </div>
        </div>

        <div id="sigCropWrap" style="display:none;">
          <p class="sig-hint">Drag a box around just the signature, then crop.</p>
          <div class="sig-crop-container" id="sigCropContainer">
            <img id="sigCropImage" draggable="false">
            <div class="sig-crop-rect" id="sigCropRect"></div>
          </div>
          <label class="sig-checkbox"><input type="checkbox" id="sigTransparent" checked> Remove white background</label>
          <div class="sig-scan-actions">
            <button type="button" class="btn primary" id="sigCropUse">Crop &amp; use</button>
            <button type="button" class="btn" id="sigCropCancel">Cancel</button>
          </div>
        </div>

        <div class="sig-current">
          <div class="sig-preview" id="sigPreview">no signature selected</div>
          <button type="button" class="btn" id="sigSaveToLibrary" disabled>Save to my signatures</button>
        </div>

        <p class="sig-hint" id="sigLibCount"></p>
        <div class="sig-library" id="sigLibrary"></div>
      </div>

      <!-- Form I specific fields -->
      <div id="formIFields" style="display:none;">
        <h2 class="section-label" style="margin-top:1.5rem;">Form I details</h2>
        <div class="field-group">
          <label for="fiPost">Post held</label>
          <input type="text" id="fiPost" placeholder="e.g. MTS">
        </div>
        <div class="field-group">
          <label for="fiOffice">Department / Office</label>
          <input type="text" id="fiOffice" value="District Litigation Office, Kupwara">
        </div>
        <div class="field-group">
          <label for="fiGrounds">Grounds on which leave is applied for</label>
          <input type="text" id="fiGrounds" placeholder="e.g. Ill health of my mother-in-law">
        </div>
        <div class="field-group">
          <label for="fiPrefix">Sundays/holidays prefixed or suffixed (if any)</label>
          <input type="text" id="fiPrefix" placeholder="optional">
        </div>
        <div class="field-group">
          <label for="fiAddress">Address during leave period</label>
          <input type="text" id="fiAddress" placeholder="e.g. Sulkoot, Kupwara">
        </div>
      </div>

    </div>

    <div class="preview-pane">
      <div class="paper" id="paper"></div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const el = id => document.getElementById(id);

    const ADDRESSEE_PRESETS = {
      director: "The Director Litigation,\nKashmir.",
      principal: "The Principal,\nGovernment Medical College,\nHandwara."
    };

    let signatureDataUrl = null;

    function fmtDate(iso) {
      if (!iso) return '__.__.____';
      const [y, m, d] = iso.split('-');
      return `${d}.${m}.${y}`;
    }

    function currentReason() {
      const preset = el('reasonPreset').value;
      return preset === 'custom' ? (el('reasonCustom').value || '[reason]') : preset;
    }

    function currentAddressee() {
      const preset = el('addresseePreset').value;
      return preset === 'custom' ? (el('addresseeCustom').value || 'The Director Litigation,\nKashmir.') : ADDRESSEE_PRESETS[preset];
    }

    function currentDesignation() {
      const preset = el('designationPreset').value;
      return preset === 'custom' ? (el('designationCustom').value || '[Designation]') : preset;
    }

    function toggleFieldsForType(type) {
      const show = (id, on) => el(id).style.display = on ? '' : 'none';
      show('dateFieldsSingle', ['casual1', 'halfday', 'stationLeave'].includes(type));
      show('dateFieldsRange', ['casualN', 'earnedLetter', 'earnedFormI', 'joining'].includes(type));
      show('numDaysField', type === 'casualN');
      show('sessionField', type === 'halfday');
      show('reasonField', type !== 'earnedFormI');
      show('durationField', ['earnedLetter'].includes(type));
      show('formIFields', type === 'earnedFormI');
      const reasonCustomOn = el('reasonPreset').value === 'custom' && type !== 'earnedFormI';
      show('reasonCustomField', reasonCustomOn);
    }

    function numToWord(n) {
      const words = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
      return words[n] || n;
    }

    function buildLetter() {
      const type = el('leaveType').value;
      const addressee = currentAddressee();
      const name = el('applicantName').value || '[Your Name]';
      const designation = currentDesignation();
      const attId = el('attendanceId').value.trim();
      const copyTo = el('copyTo').value;
      const reason = currentReason();

      let subject = '', body = '';

      if (type === 'casual1') {
        const date = fmtDate(el('dateSingle').value);
        subject = 'Application for one day Casual Leave.';
        body = `With high regards it is submitted that due to ${reason}, I am unable to attend my duties today, i.e., ${date}. So it is requested to kindly sanction a one day leave in my favour.<br>Same shall be your most kindness.`;
      } else if (type === 'casualN') {
        const from = fmtDate(el('dateFrom').value);
        const to = fmtDate(el('dateTo').value);
        const n = el('numDays').value || 2;
        subject = `Application seeking ${numToWord(n)} days Casual Leave.`;
        body = `With respect and high regards it is submitted that due to ${reason} I am unable to attend my duties for ${numToWord(n)} days, i.e., from ${from} to ${to}. So it is requested to kindly sanction ${numToWord(n)} days leave in my favour.<br>Same shall be your most kindness.`;
      } else if (type === 'halfday') {
        const date = fmtDate(el('dateSingle').value);
        const session = el('session').value;
        const half = session === 'Morning' ? 'first' : 'second';
        subject = `Application for half-day leave on ${date} — ${session} Session.`;
        body = `With high regards it is submitted that due to ${reason} I am unable to attend my duties in the ${half} half today on ${date}. So it is requested to kindly sanction a halfday leave in my favour.<br>Same shall be your most kindness.`;
      } else if (type === 'stationLeave') {
        const date = fmtDate(el('dateSingle').value);
        subject = 'Application for one day Casual Leave with a permission to leave the Station.';
        body = `With high regards, it is submitted that due to ${reason}, I am not able to attend my duties today, i.e., on ${date}. So, it is requested to kindly sanction a one day casual leave in my favour, with permission to leave the station.<br>Same shall be your most kindness.`;
      } else if (type === 'earnedLetter') {
        const from = fmtDate(el('dateFrom').value);
        const duration = el('duration').value || '[duration]';
        subject = `Application for Earned Leave for ${duration}`;
        const attClause = attId ? `, Attendance ID <b>${attId}</b>,` : ',';
        body = `Most respectfully, I, <b>${name}</b>, ${designation}${attClause} request that I may kindly be granted <b>Earned Leave for a period of ${duration} w.e.f ${from}</b>, on account of ${reason}.<br>I shall be highly obliged for your kind consideration and sanction of the leave for the aforesaid period.`;
      } else if (type === 'joining') {
        const from = fmtDate(el('dateFrom').value);
        const to = fmtDate(el('dateTo').value);
        const today = fmtDate(el('dateSingle').value) === '__.__.____' ? to : fmtDate(el('dateSingle').value);
        subject = 'Joining Report.';
        body = `With respect it is submitted that the undersigned was on leave from ${from} to ${to}. Now the undersigned has resumed duties today on ${today}.<br>Hence the joining report is submitted for favour of information and further necessary action.`;
      }

      const sigHtml = signatureDataUrl ? `<img class="sig-img" src="${signatureDataUrl}">` : '';

      if (type === 'earnedFormI') {
        return buildFormI();
      }

      const attLine = attId ? `<br>Attendance ID: ${attId}` : '';

      return `
        <p>${addressee.replace(/\n/g, '<br>')}</p>
        <p class="subject">Subject: — ${subject}</p>
        <p>Sir,</p>
        <p>${body}</p>
        <p class="sig-line">Your's faithfully,<br>${sigHtml}${name},<br>(${designation})${attLine}</p>
        <div class="copy-block">Copy to the:-<br>${copyTo.replace(/\n/g, '<br>')}</div>
      `;
    }

    function buildFormI() {
      const from = fmtDate(el('dateFrom').value);
      const to = fmtDate(el('dateTo').value);
      const n = el('numDays') && el('numDays').value ? el('numDays').value : '';
      const name = el('applicantName').value || '[Your Name]';
      const post = el('fiPost').value || currentDesignation();
      const office = el('fiOffice').value;
      const grounds = el('fiGrounds').value || '[grounds for leave]';
      const prefix = el('fiPrefix').value || '—';
      const address = el('fiAddress').value || '[address during leave]';
      const sigHtml = signatureDataUrl ? `<img class="sig-img" src="${signatureDataUrl}">` : '';

      return `
        <p style="text-align:center; font-weight:600;">FORM I<br><span style="font-weight:400; font-size:0.85rem;">[See rule 15]</span><br>APPLICATION FOR LEAVE OR FOR EXTENSION OF LEAVE</p>
        <table class="formI">
          <tr><td class="num">1.</td><td>Name of applicant</td><td>${name}</td></tr>
          <tr><td class="num">2.</td><td>Post held</td><td>${post}</td></tr>
          <tr><td class="num">3.</td><td>Department/Office</td><td>${office}</td></tr>
          <tr><td class="num">4.</td><td>Pay</td><td></td></tr>
          <tr><td class="num">5.</td><td>House rent and other compensatory allowances drawn in the present post</td><td></td></tr>
          <tr><td class="num">6.</td><td>Nature and period of leave applied for and date from which required</td><td>Earned Leave w.e.f ${from} to ${to}</td></tr>
          <tr><td class="num">7.</td><td>Sundays and holidays, if any, proposed to be prefixed/suffixed to leave</td><td>${prefix}</td></tr>
          <tr><td class="num">8.</td><td>Grounds on which leave is applied for</td><td>${grounds}</td></tr>
          <tr><td class="num">9.</td><td>Date of return from last leave and the nature and period of the leave</td><td></td></tr>
          <tr><td class="num">10.</td><td>Address during leave period</td><td>${address}</td></tr>
          <tr><td class="num">11.</td><td colspan="2">In the event of my resignation or voluntary retirement from service, I undertake to refund the difference in leave salary as applicable under the rules.</td></tr>
          <tr><td class="num">12.</td><td>Certificate regarding admissibility of leave</td><td>${sigHtml}Signature of applicant (with date): ${name}</td></tr>
        </table>
      `;
    }

    function render() {
      el('paper').innerHTML = buildLetter();
    }

    function bindLive() {
      document.querySelectorAll('#leaveType, #dateSingle, #dateFrom, #dateTo, #numDays, #session, #reasonPreset, #reasonCustom, #duration, #addresseePreset, #addresseeCustom, #applicantName, #designationPreset, #designationCustom, #attendanceId, #copyTo, #fiPost, #fiOffice, #fiGrounds, #fiPrefix, #fiAddress')
        .forEach(node => {
          if (!node) return;
          node.addEventListener('input', () => { render(); });
          node.addEventListener('change', () => { render(); });
        });

      el('leaveType').addEventListener('change', e => {
        toggleFieldsForType(e.target.value);
        render();
      });
      el('reasonPreset').addEventListener('change', () => {
        toggleFieldsForType(el('leaveType').value);
        render();
      });
      el('addresseePreset').addEventListener('change', () => {
        el('addresseeCustomField').style.display = el('addresseePreset').value === 'custom' ? '' : 'none';
        render();
      });
      el('designationPreset').addEventListener('change', () => {
        el('designationCustomField').style.display = el('designationPreset').value === 'custom' ? '' : 'none';
        render();
      });

    }

    /* ---------- Signature: upload / scan / crop / library ---------- */

    const SIG_KEY = 'arzi_signatures_v1';
    const SIG_LIMIT = 40;
    let camStream = null;
    let rawImageForCrop = null; // dataURL of the source image (upload or captured frame)
    let cropRect = null; // {x,y,w,h} in displayed-image pixels

    function loadSignatures() {
      try { return JSON.parse(localStorage.getItem(SIG_KEY)) || []; }
      catch (e) { return []; }
    }
    function saveSignatures(list) {
      localStorage.setItem(SIG_KEY, JSON.stringify(list));
    }

    function setCurrentSignature(dataUrl) {
      signatureDataUrl = dataUrl;
      el('sigPreview').innerHTML = dataUrl ? `<img src="${dataUrl}">` : 'no signature selected';
      el('sigSaveToLibrary').disabled = !dataUrl;
      renderLibrary();
      render();
    }

    function renderLibrary() {
      const list = loadSignatures();
      el('sigLibCount').textContent = `Saved signatures: ${list.length} / ${SIG_LIMIT}`;
      const wrap = el('sigLibrary');
      wrap.innerHTML = '';
      list.forEach((dataUrl, i) => {
        const item = document.createElement('div');
        item.className = 'sig-lib-item' + (dataUrl === signatureDataUrl ? ' selected' : '');
        item.innerHTML = `<img src="${dataUrl}"><button type="button" class="sig-lib-remove" title="Remove">&times;</button>`;
        item.querySelector('img').addEventListener('click', () => setCurrentSignature(dataUrl));
        item.querySelector('.sig-lib-remove').addEventListener('click', (ev) => {
          ev.stopPropagation();
          const updated = loadSignatures().filter(s => s !== dataUrl);
          saveSignatures(updated);
          if (signatureDataUrl === dataUrl) setCurrentSignature(null);
          else renderLibrary();
        });
        wrap.appendChild(item);
      });
    }

    el('sigSaveToLibrary').addEventListener('click', () => {
      if (!signatureDataUrl) return;
      let list = loadSignatures();
      if (list.includes(signatureDataUrl)) return;
      if (list.length >= SIG_LIMIT) list.shift(); // drop oldest
      list.push(signatureDataUrl);
      saveSignatures(list);
      renderLibrary();
    });

    // Tabs
    document.querySelectorAll('.sig-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sig-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        el('sigPanelUpload').style.display = tab.dataset.tab === 'upload' ? '' : 'none';
        el('sigPanelScan').style.display = tab.dataset.tab === 'scan' ? '' : 'none';
        if (tab.dataset.tab !== 'scan') stopCamera();
      });
    });

    // Upload
    el('sigUpload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => openCropper(ev.target.result);
      reader.readAsDataURL(file);
    });

    // Camera
    async function startCamera() {
      try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        el('sigVideo').srcObject = camStream;
        el('sigCapture').disabled = false;
      } catch (err) {
        alert('Could not access the camera: ' + err.message);
      }
    }
    function stopCamera() {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
        el('sigCapture').disabled = true;
      }
    }
    el('sigStartCam').addEventListener('click', startCamera);
    el('sigCapture').addEventListener('click', () => {
      const video = el('sigVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      openCropper(canvas.toDataURL('image/png'));
      stopCamera();
    });

    // Crop tool
    function openCropper(dataUrl) {
      rawImageForCrop = dataUrl;
      const img = el('sigCropImage');
      img.src = dataUrl;
      el('sigCropWrap').style.display = '';
      el('sigCropRect').style.display = 'none';
      cropRect = null;
    }

    el('sigCropCancel').addEventListener('click', () => {
      el('sigCropWrap').style.display = 'none';
      rawImageForCrop = null;
    });

    (function initCropDrag() {
      const container = el('sigCropContainer');
      const rectEl = el('sigCropRect');
      let dragging = false, startX = 0, startY = 0;

      function pointerPos(e) {
        const box = container.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - box.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - box.top;
        return { x: Math.max(0, Math.min(cx, box.width)), y: Math.max(0, Math.min(cy, box.height)) };
      }

      function begin(e) {
        const p = pointerPos(e);
        dragging = true;
        startX = p.x; startY = p.y;
        rectEl.style.display = 'block';
        rectEl.style.left = startX + 'px';
        rectEl.style.top = startY + 'px';
        rectEl.style.width = '0px';
        rectEl.style.height = '0px';
      }
      function move(e) {
        if (!dragging) return;
        const p = pointerPos(e);
        const x = Math.min(startX, p.x), y = Math.min(startY, p.y);
        const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
        rectEl.style.left = x + 'px';
        rectEl.style.top = y + 'px';
        rectEl.style.width = w + 'px';
        rectEl.style.height = h + 'px';
        cropRect = { x, y, w, h };
      }
      function end() { dragging = false; }

      container.addEventListener('mousedown', begin);
      container.addEventListener('mousemove', move);
      container.addEventListener('mouseup', end);
      container.addEventListener('touchstart', begin, { passive: true });
      container.addEventListener('touchmove', move, { passive: true });
      container.addEventListener('touchend', end);
    })();

    el('sigCropUse').addEventListener('click', () => {
      const img = el('sigCropImage');
      if (!cropRect || cropRect.w < 4 || cropRect.h < 4) {
        alert('Drag a box around the signature first.');
        return;
      }
      const scaleX = img.naturalWidth / img.clientWidth;
      const scaleY = img.naturalHeight / img.clientHeight;

      const sx = cropRect.x * scaleX, sy = cropRect.y * scaleY;
      const sw = cropRect.w * scaleX, sh = cropRect.h * scaleY;

      const canvas = document.createElement('canvas');
      canvas.width = sw; canvas.height = sh;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

      if (el('sigTransparent').checked) {
        const data = ctx.getImageData(0, 0, sw, sh);
        const d = data.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 200 && d[i+1] > 200 && d[i+2] > 200) d[i+3] = 0;
        }
        ctx.putImageData(data, 0, 0);
      }

      setCurrentSignature(canvas.toDataURL('image/png'));
      el('sigCropWrap').style.display = 'none';
    });

    async function exportAs(type) {
      const target = el('paper');
      const canvas = await html2canvas(target, { scale: 2, backgroundColor: '#ffffff' });
      if (type === 'image') {
        const link = document.createElement('a');
        link.download = 'leave-application.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'pt', format: 'a4' });
        const pageWidth = pdf.internal.pageSize.getWidth();
        const imgWidth = pageWidth - 72;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 36, 36, imgWidth, imgHeight);
        pdf.save('leave-application.pdf');
      }
    }

    document.getElementById('export-image').addEventListener('click', () => exportAs('image'));
    document.getElementById('export-pdf').addEventListener('click', () => exportAs('pdf'));

    toggleFieldsForType('casual1');
    bindLive();
    renderLibrary();
    render();
  </script>

</body>
</html>
