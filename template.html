<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arzi — Leave Application</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Caveat+Brush&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Indie+Flower&family=Patrick+Hand&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Handlee&family=Gochi+Hand&family=Architects+Daughter&family=Covered+By+Your+Grace&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Rock+Salt&family=Dancing+Script:wght@400;600;700&family=Sacramento&family=Satisfy&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Great+Vibes&family=Allura&family=Yellowtail&family=Homemade+Apple&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<style>
  body { background: var(--paper); }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--line);
    background: var(--paper-raised);
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .header-left {
    display: flex;
    align-items: center;
    gap: 1rem;
  }
  .back-link, .editor-nav-link {
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-decoration: none;
    font-weight: 500;
  }
  .editor-nav-link {
    color: var(--maroon);
    font-weight: 600;
    border-left: 1px solid var(--line);
    padding-left: 1rem;
  }
  .back-link:hover, .editor-nav-link:hover { color: var(--maroon-deep); text-decoration: underline; }

  .export-actions { display: flex; gap: 0.6rem; }
  .btn {
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 600;
    padding: 0.55rem 1rem;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    cursor: pointer;
  }
  .btn.primary { background: var(--maroon); border-color: var(--maroon); color: var(--paper-raised); }
  .btn.primary:hover { background: var(--maroon-deep); }
  .btn:hover { border-color: var(--brass); }

  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    padding: 1.75rem 1.25rem 3rem;
    max-width: 1180px;
    margin: 0 auto;
  }

  .form-pane {
    flex: 1 1 360px;
    min-width: 320px;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 1.25rem;
  }

  .field-group { margin-bottom: 1.1rem; }
  .field-group label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 0.3rem;
  }
  .field-group select,
  .field-group input[type="text"],
  .field-group input[type="date"],
  .field-group input[type="number"],
  .field-group textarea {
    width: 100%;
    padding: 0.5rem 0.6rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    background: #fff;
    color: var(--ink);
  }
  .field-group textarea { resize: vertical; min-height: 3rem; }
  .field-row { display: flex; gap: 0.75rem; }
  .field-row > div { flex: 1; }

  .section-label {
    font-family: var(--font-display);
    font-size: 1.05rem;
    color: var(--maroon);
    margin: 0 0 0.9rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--line-soft);
  }

  .sig-tabs { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .sig-tab {
    font-family: var(--font-body);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 0.4rem 0.75rem;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink-soft);
    border-radius: 4px;
    cursor: pointer;
  }
  .sig-tab.active { background: var(--maroon); border-color: var(--maroon); color: #fff; }

  .sig-tab-panel { margin-bottom: 0.75rem; }
  .sig-tab-panel input[type="file"] { font-size: 0.85rem; }

  #sigVideo { width: 100%; max-height: 220px; background: #111; border-radius: 4px; display: block; }
  .sig-scan-actions { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

  .sig-hint { font-size: 0.75rem; color: var(--ink-soft); margin: 0.3rem 0; }

  .sig-crop-container {
    touch-action: none;
    position: relative;
    max-width: 100%;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: repeating-conic-gradient(#eee 0% 25%, #fff 0% 50%) 50% / 16px 16px;
    user-select: none;
  }
  .sig-crop-container img { display: block; max-width: 100%; }
  .sig-crop-rect {
    position: absolute;
    border: 2px dashed var(--maroon);
    background: rgba(122,35,49,0.12);
    display: none;
  }

  .sig-checkbox { display: block; font-size: 0.8rem; color: var(--ink-soft); margin: 0.5rem 0; }

  .sig-current {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-top: 0.5rem;
  }
  .sig-preview {
    width: 110px;
    height: 50px;
    border: 1px dashed var(--line);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-size: 0.68rem;
    color: var(--ink-soft);
    background: #fff;
    flex-shrink: 0;
  }
  .sig-preview img { max-width: 100%; max-height: 100%; }

  .sig-library {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .sig-lib-item {
    position: relative;
    width: 72px;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .sig-lib-item.selected { border-color: var(--maroon); box-shadow: 0 0 0 2px rgba(122,35,49,0.2); }
  .sig-lib-item img { max-width: 100%; max-height: 100%; }
  .sig-lib-remove {
    position: absolute;
    top: -6px;
    right: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--maroon);
    color: #fff;
    font-size: 0.65rem;
    line-height: 18px;
    text-align: center;
    cursor: pointer;
    border: none;
  }

  .sig-file-actions {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.6rem;
  }
  .btn-small {
    font-size: 0.74rem;
    padding: 0.35rem 0.6rem;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
    color: var(--ink);
  }
  .btn-small:hover { border-color: var(--maroon); }

  .preview-pane {
    flex: 1 1 420px;
    min-width: 320px;
  }

  .style-toolbar {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.75rem;
    padding: 0.6rem 0.75rem;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    flex-wrap: wrap;
  }
  .style-toolbar select,
  .style-toolbar input[type="number"] {
    padding: 0.4rem 0.5rem;
    border: 1px solid var(--line);
    border-radius: 4px;
    font-family: var(--font-body);
    font-size: 0.82rem;
    background: #fff;
    color: var(--ink);
  }
  .font-size-wrap {
    display: flex;
    align-items: center;
    gap: 0.25rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .font-size-wrap input[type="number"] {
    width: 58px;
  }
  .align-toolbar {
    display: flex;
    border: 1px solid var(--line);
    border-radius: 4px;
    overflow: hidden;
    background: #fff;
  }
  .btn-align {
    background: #fff;
    border: none;
    padding: 0.35rem 0.55rem;
    font-size: 0.78rem;
    cursor: pointer;
    color: var(--ink-soft);
    font-weight: 600;
    border-right: 1px solid var(--line);
  }
  .btn-align:last-child { border-right: none; }
  .btn-align.active {
    background: var(--maroon);
    color: #fff;
  }

  .color-label {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .color-label input[type="color"] {
    width: 34px;
    height: 28px;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
  }

  .paper {
    background: #ffffff;
    border: 1px solid var(--line);
    box-shadow: 0 12px 26px -16px rgba(35,40,58,0.3);
    padding: 2.5rem 2.25rem;
    width: 100%;
    max-width: 620px;
    aspect-ratio: 210 / 297;
    margin: 0 auto;
    font-family: var(--font-display);
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink);
    overflow-y: auto;
    text-align: left;
  }
  .paper p { margin: 0 0 0.9rem; }
  .paper .subject { font-weight: 600; }
  .paper .sig-line { margin-top: 0.75rem; }
  .paper .sig-img {
  max-height: 28px;
  max-width: 90px;
  display: block;
  margin: 0.35rem 0;
  object-fit: contain;
}
  .paper .copy-block { margin-top: 1.6rem; font-size: 0.9em; }
  .paper table.formI {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85em;
    text-align: left;
  }
  .paper table.formI td {
    border: 1px solid #999;
    padding: 0.4rem 0.5rem;
    vertical-align: top;
    text-align: left !important;
  }
  .paper table.formI td.num { width: 2.2rem; }

  @media (max-width: 760px) {
    .layout { flex-direction: column; }
  }

  @media print {
    body * { visibility: hidden; }
    .paper, .paper * { visibility: visible; }
    .paper {
      position: absolute;
      left: 0;
      top: 0;
      width: 100% !important;
      max-width: 100% !important;
      box-shadow: none !important;
      border: none !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow: visible !important;
      aspect-ratio: auto !important;
    }
  }

  .pdf-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,20,25,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 1.25rem;
  }
  .pdf-modal-inner {
    background: #fff;
    border-radius: 8px;
    width: 100%;
    max-width: 780px;
    height: 90vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pdf-modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--line);
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--ink);
  }
  .pdf-modal-actions { display: flex; gap: 0.5rem; }
  #pdfPreviewFrame {
    flex: 1;
    border: none;
    width: 100%;
  }
  #pdfPreviewPages {
    flex: 1;
    overflow-y: auto;
    background: #56575c;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  #pdfPreviewPages img {
    max-width: 100%;
    width: 560px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    display: block;
  }
  .pdf-page-label {
    color: #eee;
    font-size: 0.72rem;
    font-family: var(--font-body);
    text-align: center;
    margin-bottom: -0.6rem;
  }
</style>
</head>
<body>

  <div class="app-header">
    <div class="header-left">
      <a class="back-link" href="index.html">&larr; Back</a>
      <a class="editor-nav-link" href="editor.html" title="Open freeform handwritten letter editor">Write by yourself &rarr;</a>
    </div>
    <div class="export-actions">
      <button class="btn" id="export-image">Save as Image</button>
      <button class="btn primary" id="export-pdf">Save as PDF</button>
    </div>
  </div>

  <div class="layout">

    <div class="form-pane">
      <h2 class="section-label">Leave details</h2>

      <div class="field-group">
        <label for="leaveType">Leave type</label>
        <select id="leaveType">
          <option value="casual1">Casual Leave — One Day</option>
          <option value="casualN">Casual Leave — Multiple Days</option>
          <option value="halfday">Half-Day Casual Leave</option>
          <option value="stationLeave">Casual Leave (with permission to leave Station)</option>
          <option value="earnedLetter">Earned Leave — Letter format</option>
          <option value="earnedFormI">Earned Leave — Form I (Official)</option>
          <option value="joining">Joining Report (after leave)</option>
        </select>
      </div>
<div class="field-group">
          <label style="display:flex; justify-content:space-between; align-items:center;">
            <span>Signature size</span>
            <span id="sigSizeVal" style="font-size:0.8rem; font-weight:normal; color:var(--ink-soft);">38px</span>
          </label>
          <input type="range" id="sigSizeSlider" min="20" max="75" value="38" step="2" style="width:100%; cursor:pointer;">
        </div>
      <div class="field-group" id="dateFieldsSingle">
        <label for="dateSingle">Date</label>
        <input type="date" id="dateSingle">
      </div>

      <div class="field-group" id="dateFieldsRange" style="display:none;">
        <div class="field-row">
          <div>
            <label for="dateFrom">From</label>
            <input type="date" id="dateFrom">
          </div>
          <div>
            <label for="dateTo">To</label>
            <input type="date" id="dateTo">
          </div>
        </div>
      </div>

      <div class="field-group" id="numDaysField" style="display:none;">
        <label for="numDays">Number of days</label>
        <input type="number" id="numDays" min="1" value="2">
      </div>

      <!-- Joining Report Specific Fields -->
      <div id="joiningFields" style="display:none;">
        <div class="field-group">
          <label for="joiningLeaveType">Nature of leave availed</label>
          <select id="joiningLeaveType">
            <option value="earned leave">Earned Leave</option>
            <option value="casual leave">Casual Leave</option>
            <option value="medical leave">Medical / Commuted Leave</option>
            <option value="maternity leave">Maternity Leave</option>
            <option value="paternity leave">Paternity Leave</option>
            <option value="child care leave">Child Care Leave (CCL)</option>
            <option value="station leave">Station Leave</option>
            <option value="custom">Other (type custom)</option>
          </select>
        </div>
        <div class="field-group" id="joiningCustomField" style="display:none;">
          <label for="joiningCustomText">Custom leave type</label>
          <input type="text" id="joiningCustomText" placeholder="e.g. Special Casual Leave">
        </div>
        <div class="field-row">
          <div class="field-group">
            <label for="joiningResumeDate">Resumed duty on</label>
            <input type="date" id="joiningResumeDate">
          </div>
          <div class="field-group">
            <label for="joiningSession">Session</label>
            <select id="joiningSession">
              <option value="Forenoon">Forenoon (FN)</option>
              <option value="Afternoon">Afternoon (AN)</option>
            </select>
          </div>
        </div>
      </div>

      <div class="field-group" id="sessionField" style="display:none;">
        <label for="session">Session</label>
        <select id="session">
          <option value="Morning">Morning session (first half)</option>
          <option value="Evening">Evening session (second half)</option>
        </select>
      </div>

      <div class="field-group" id="stationField" style="display:none;">
        <label for="stationNote">Note (leave-station permission is added to the subject line automatically)</label>
      </div>

      <div class="field-group" id="reasonField">
        <label for="reasonPreset">Reason</label>
        <select id="reasonPreset">
          <option value="personal emergency">Personal emergency</option>
          <option value="unforeseen circumstances">Unforeseen circumstances</option>
          <option value="an urgent work">Urgent work</option>
          <option value="an unavoidable urgency">Unavoidable urgency</option>
          <option value="a medical appointment">Medical appointment</option>
          <option value="the sudden bereavement in my family">Sudden bereavement</option>
          <option value="the requirement to appear as a witness in a court case">Witness in a court case</option>
          <option value="custom">Other (type your own)</option>
        </select>
      </div>

      <div class="field-group" id="reasonCustomField" style="display:none;">
        <label for="reasonCustom">Custom reason</label>
        <textarea id="reasonCustom" placeholder="Type the reason exactly as it should appear"></textarea>
      </div>

      <div class="field-group" id="durationField" style="display:none;">
        <label for="duration">Duration</label>
        <input type="text" id="duration" placeholder="e.g. one month / 30 days">
      </div>

      <h2 class="section-label" style="margin-top:1.5rem;">Addressed to</h2>
      <div class="field-group">
        <label for="addresseePreset">Addressee</label>
        <select id="addresseePreset">
          <option value="director">The Director Litigation, Kashmir</option>
          <option value="principal">The Principal, Government Medical College, Handwara</option>
          <option value="custom">Other (type your own)</option>
        </select>
      </div>
      <div class="field-group" id="addresseeCustomField" style="display:none;">
        <label for="addresseeCustom">Custom addressee (one line per line)</label>
        <textarea id="addresseeCustom" placeholder="The [Designation],&#10;[Office],&#10;[Place]."></textarea>
      </div>

      <h2 class="section-label" style="margin-top:1.5rem;">Your details</h2>

      <div class="field-group">
        <label for="applicantName">Full name</label>
        <input type="text" id="applicantName" placeholder="e.g. Farooq Ahmad Payer">
      </div>

      <div class="field-row">
        <div class="field-group">
          <label for="designationPreset">Designation</label>
          <select id="designationPreset">
            <option value="MTS">MTS</option>
            <option value="Jr. Asst">Jr. Asst</option>
            <option value="Sr. Asst">Sr. Asst</option>
            <option value="District Litigation Officer">District Litigation Officer</option>
            <option value="custom">Other</option>
          </select>
        </div>
        <div class="field-group">
          <label for="attendanceId">Attendance ID (optional)</label>
          <input type="text" id="attendanceId" placeholder="e.g. 63907072 — leave blank to omit">
        </div>
      </div>
      <div class="field-group" id="designationCustomField" style="display:none;">
        <label for="designationCustom">Custom designation</label>
        <input type="text" id="designationCustom">
      </div>

      <div class="field-group">
        <label for="copyTo">Copy to (one per line)</label>
        <textarea id="copyTo">1. District Litigation Officer, Kupwara for information.</textarea>
      </div>

      <div class="field-group">
        <label>Signature</label>

        <div class="sig-tabs">
          <button type="button" class="sig-tab active" data-tab="upload">Upload</button>
          <button type="button" class="sig-tab" data-tab="scan">Scan (camera)</button>
        </div>

        <div class="sig-tab-panel" id="sigPanelUpload">
          <input type="file" id="sigUpload" accept="image/*">
        </div>

        <div class="sig-tab-panel" id="sigPanelScan" style="display:none;">
          <video id="sigVideo" autoplay playsinline></video>
          <div class="sig-scan-actions">
            <button type="button" class="btn" id="sigStartCam">Start camera</button>
            <button type="button" class="btn" id="sigCapture" disabled>Capture frame</button>
          </div>
        </div>

        <div id="sigCropWrap" style="display:none;">
          <p class="sig-hint">Drag a box around just the signature, then crop.</p>
          <div class="sig-crop-container" id="sigCropContainer">
            <img id="sigCropImage" draggable="false">
            <div class="sig-crop-rect" id="sigCropRect"></div>
          </div>
          <label class="sig-checkbox"><input type="checkbox" id="sigTransparent" checked> Remove white background</label>
          <div class="sig-scan-actions">
            <button type="button" class="btn primary" id="sigCropUse">Crop &amp; use</button>
            <button type="button" class="btn" id="sigCropCancel">Cancel</button>
          </div>
        </div>

        <div class="sig-current">
          <div class="sig-preview" id="sigPreview">no signature selected</div>
          <button type="button" class="btn" id="sigSaveToLibrary" disabled>Save to my signatures</button>
        </div>

        <p class="sig-hint" id="sigLibCount">Saved signatures: 0 / 40</p>
        <div class="sig-library" id="sigLibrary"></div>

        <div class="sig-file-actions">
          <button type="button" class="btn-small" id="sigExportBackup">Export Backup (.json)</button>
          <button type="button" class="btn-small" id="sigImportBackupTrigger">Import Backup</button>
          <input type="file" id="sigImportFile" accept=".json" style="display:none;">
        </div>
      </div>

      <!-- Form I specific fields -->
      <div id="formIFields" style="display:none;">
        <h2 class="section-label" style="margin-top:1.5rem;">Form I details</h2>
        <div class="field-group">
          <label for="fiPost">Post held</label>
          <input type="text" id="fiPost" placeholder="e.g. MTS">
        </div>
        <div class="field-group">
          <label for="fiOffice">Department / Office</label>
          <input type="text" id="fiOffice" value="District Litigation Office, Kupwara">
        </div>
        <div class="field-group">
          <label for="fiGrounds">Grounds on which leave is applied for</label>
          <input type="text" id="fiGrounds" placeholder="e.g. Ill health of my mother-in-law">
        </div>
        <div class="field-group">
          <label for="fiPrefix">Sundays/holidays prefixed or suffixed (if any)</label>
          <input type="text" id="fiPrefix" placeholder="optional">
        </div>
        <div class="field-group">
          <label for="fiAddress">Address during leave period</label>
          <input type="text" id="fiAddress" placeholder="e.g. Sulkoot, Kupwara">
        </div>
      </div>

    </div>

    <div class="preview-pane">
      <div class="style-toolbar">
        <select id="fontFamily">
          <optgroup label="Typed">
            <option value="'Lora', serif" selected>Lora</option>
            <option value="Arial, sans-serif">Arial</option>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    const el = id => document.getElementById(id);

    const ADDRESSEE_PRESETS = {
      director: "The Director Litigation,\nKashmir.",
      principal: "The Principal,\nGovernment Medical College,\nHandwara."
    };

    let signatureDataUrl = null;
    let currentTextAlign = 'left';

    function fmtDate(iso) {
      if (!iso) return '__.__.____';
      const [y, m, d] = iso.split('-');
      return `${d}.${m}.${y}`;
    }

    function addDays(isoDate, days) {
      if (!isoDate) return '';
      const [y, m, d] = isoDate.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      date.setDate(date.getDate() + days);
      const yy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, '0');
      const dd = String(date.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function diffDaysInclusive(isoFrom, isoTo) {
      if (!isoFrom || !isoTo) return 1;
      const [y1, m1, d1] = isoFrom.split('-').map(Number);
      const [y2, m2, d2] = isoTo.split('-').map(Number);
      const dt1 = new Date(y1, m1 - 1, d1);
      const dt2 = new Date(y2, m2 - 1, d2);
      const diffTime = dt2.getTime() - dt1.getTime();
      const diff = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diff > 0 ? diff : 1;
    }

    function initDefaultDates() {
      const today = new Date().toISOString().split('T')[0];
      if (!el('dateSingle').value) el('dateSingle').value = today;
      if (!el('dateFrom').value) el('dateFrom').value = today;
      
      const days = parseInt(el('numDays').value, 10) || 2;
      if (!el('dateTo').value) {
        el('dateTo').value = addDays(today, days - 1);
      }
      if (!el('joiningResumeDate').value) {
        el('joiningResumeDate').value = addDays(el('dateTo').value, 1);
      }
    }

    const PROFILE_FIELDS = [
      'applicantName', 'designationPreset', 'designationCustom',
      'attendanceId', 'copyTo', 'fiOffice', 'fiPost'
    ];

    function saveUserProfile() {
      const profile = {};
      PROFILE_FIELDS.forEach(f => {
        if (el(f)) profile[f] = el(f).value;
      });
      try { localStorage.setItem('arzi_user_profile', JSON.stringify(profile)); } catch (e) {}
    }

    function loadUserProfile() {
      try {
        const raw = localStorage.getItem('arzi_user_profile');
        if (!raw) return;
        const profile = JSON.parse(raw);
        PROFILE_FIELDS.forEach(f => {
          if (profile[f] !== undefined && el(f)) {
            el(f).value = profile[f];
          }
        });
        if (el('designationPreset').value === 'custom') {
          el('designationCustomField').style.display = '';
        }
      } catch (e) {}
    }

    function currentReason() {
      const preset = el('reasonPreset').value;
      return preset === 'custom' ? (el('reasonCustom').value || '[reason]') : preset;
    }

    function currentAddressee() {
      const preset = el('addresseePreset').value;
      return preset === 'custom' ? (el('addresseeCustom').value || 'The Director Litigation,\nKashmir.') : ADDRESSEE_PRESETS[preset];
    }

    function currentDesignation() {
      const preset = el('designationPreset').value;
      return preset === 'custom' ? (el('designationCustom').value || '[Designation]') : preset;
    }

    function currentJoiningLeaveType() {
      const sel = el('joiningLeaveType').value;
      if (sel === 'custom') {
        return (el('joiningCustomText').value.trim() || 'leave');
      }
      return sel;
    }

    function toggleFieldsForType(type) {
      const show = (id, on) => el(id).style.display = on ? '' : 'none';
      show('dateFieldsSingle', ['casual1', 'halfday', 'stationLeave'].includes(type));
      show('dateFieldsRange', ['casualN', 'earnedLetter', 'earnedFormI', 'joining'].includes(type));
      show('numDaysField', type === 'casualN');
      show('sessionField', type === 'halfday');
      show('joiningFields', type === 'joining');
      show('reasonField', !['earnedFormI', 'joining'].includes(type));
      show('durationField', ['earnedLetter'].includes(type));
      show('formIFields', type === 'earnedFormI');

      const reasonCustomOn = el('reasonPreset').value === 'custom' && !['earnedFormI', 'joining'].includes(type);
      show('reasonCustomField', reasonCustomOn);

      const joiningCustomOn = type === 'joining' && el('joiningLeaveType').value === 'custom';
      show('joiningCustomField', joiningCustomOn);
    }

    function numToWord(n) {
      const words = ['zero','one','two','three','four','five','six','seven','eight','nine','ten',
                     'eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
      return words[n] || n;
    }

    function buildLetter() {
      const type = el('leaveType').value;
      const addressee = currentAddressee();
      const name = el('applicantName').value || '[Your Name]';
      const designation = currentDesignation();
      const attId = el('attendanceId').value.trim();
      const copyTo = el('copyTo').value;
      const reason = currentReason();

      let subject = '', body = '';

      if (type === 'casual1') {
        const date = fmtDate(el('dateSingle').value);
        subject = 'Application for one day Casual Leave.';
        body = `With high regards it is submitted that due to ${reason}, I am unable to attend my duties today, i.e., ${date}. So it is requested to kindly sanction a one day leave in my favour.<br>Same shall be your most kindness.`;
      } else if (type === 'casualN') {
        const from = fmtDate(el('dateFrom').value);
        const to = fmtDate(el('dateTo').value);
        const n = el('numDays').value || 2;
        subject = `Application seeking ${numToWord(n)} days Casual Leave.`;
        body = `With respect and high regards it is submitted that due to ${reason} I am unable to attend my duties for ${numToWord(n)} days, i.e., from ${from} to ${to} (both dates inclusive). So it is requested to kindly sanction ${numToWord(n)} days leave in my favour.<br>Same shall be your most kindness.`;
      } else if (type === 'halfday') {
        const date = fmtDate(el('dateSingle').value);
        const session = el('session').value;
        const half = session === 'Morning' ? 'first' : 'second';
        subject = `Application for half-day leave on ${date} — ${session} Session.`;
        body = `With high regards it is submitted that due to ${reason} I am unable to attend my duties in the ${half} half today on ${date}. So it is requested to kindly sanction a halfday leave in my favour.<br>Same shall be your most kindness.`;
      } else if (type === 'stationLeave') {
        const date = fmtDate(el('dateSingle').value);
        subject = 'Application for one day Casual Leave with a permission to leave the Station.';
        body = `With high regards, it is submitted that due to ${reason}, I am not able to attend my duties today, i.e., on ${date}. So, it is requested to kindly sanction a one day casual leave in my favour, with permission to leave the station.<br>Same shall be your most kindness.`;
      } else if (type === 'earnedLetter') {
        const from = fmtDate(el('dateFrom').value);
        const to = fmtDate(el('dateTo').value);
        const rawDur = el('duration').value.trim();
        // If user enters just a number (e.g., 30), automatically append "days"
        const durationStr = rawDur ? (/^\d+$/.test(rawDur) ? `${rawDur} days` : rawDur) : '[duration]';
        
        subject = `Application for Earned Leave for ${durationStr}.`;
        const attClause = attId ? `, Attendance ID <b>${attId}</b>,` : ',';
        body = `Most respectfully, I, <b>${name}</b>, ${designation}${attClause} request that I may kindly be granted <b>Earned Leave for a period of ${durationStr}, i.e., from ${from} to ${to} (both dates inclusive)</b>, on account of ${reason}.<br>I shall be highly obliged for your kind consideration and sanction of the leave for the aforesaid period.`;} else if (type === 'joining') {
        const from = fmtDate(el('dateFrom').value);
        const to = fmtDate(el('dateTo').value);
        const leaveNature = currentJoiningLeaveType();
        const resumeDate = fmtDate(el('joiningResumeDate').value);
        const session = el('joiningSession').value;
        subject = 'Joining Report.';
        body = `With respect it is submitted that the undersigned was on <b>${leaveNature}</b> from ${from} to ${to} (both dates inclusive). Now the undersigned has resumed duties today on <b>${resumeDate} (${session})</b>.<br>Hence the joining report is submitted for favour of information and further necessary action.`;
      }

      const sigHtml = isValidSignatureDataUrl(signatureDataUrl) ? `<img class="sig-img" src="${signatureDataUrl}">` : '';

      if (type === 'earnedFormI') {
        return buildFormI();
      }

      const attLine = attId ? `<br>Attendance ID: ${attId}` : '';

      return `
        <p>${addressee.replace(/\n/g, '<br>')}</p>
        <p class="subject">Subject: — ${subject}</p>
        <p>Sir,</p>
        <p>${body}</p>
        <p class="sig-line">Yours faithfully,<br>${sigHtml}${name},<br>(${designation})${attLine}</p>
        <div class="copy-block">Copy to the:-<br>${copyTo.replace(/\n/g, '<br>')}</div>
      `;
    }

    function buildFormI() {
      const from = fmtDate(el('dateFrom').value);
      const to = fmtDate(el('dateTo').value);
      const name = el('applicantName').value || '[Your Name]';
      const post = el('fiPost').value || currentDesignation();
      const office = el('fiOffice').value;
      const grounds = el('fiGrounds').value || '[grounds for leave]';
      const prefix = el('fiPrefix').value || '—';
      const address = el('fiAddress').value || '[address during leave]';
      const sigHtml = isValidSignatureDataUrl(signatureDataUrl) ? `<img class="sig-img" src="${signatureDataUrl}">` : '';

      return `
        <p style="text-align:center; font-weight:600;">FORM I<br><span style="font-weight:400; font-size:0.85rem;">[See rule 15]</span><br>APPLICATION FOR LEAVE OR FOR EXTENSION OF LEAVE</p>
        <table class="formI">
          <tr><td class="num">1.</td><td>Name of applicant</td><td>${name}</td></tr>
          <tr><td class="num">2.</td><td>Post held</td><td>${post}</td></tr>
          <tr><td class="num">3.</td><td>Department/Office</td><td>${office}</td></tr>
          <tr><td class="num">4.</td><td>Pay</td><td></td></tr>
          <tr><td class="num">5.</td><td>House rent and other compensatory allowances drawn in the present post</td><td></td></tr>
          <tr><td class="num">6.</td><td>Nature and period of leave applied for and date from which required</td><td>Earned Leave w.e.f ${from} to ${to} (both dates inclusive)</td></tr>
          <tr><td class="num">7.</td><td>Sundays and holidays, if any, proposed to be prefixed/suffixed to leave</td><td>${prefix}</td></tr>
          <tr><td class="num">8.</td><td>Grounds on which leave is applied for</td><td>${grounds}</td></tr>
          <tr><td class="num">9.</td><td>Date of return from last leave and the nature and period of the leave</td><td></td></tr>
          <tr><td class="num">10.</td><td>Address during leave period</td><td>${address}</td></tr>
          <tr><td class="num">11.</td><td colspan="2">In the event of my resignation or voluntary retirement from service, I undertake to refund the difference in leave salary as applicable under the rules.</td></tr>
          <tr><td class="num">12.</td><td>Certificate regarding admissibility of leave</td><td>${sigHtml}Signature of applicant (with date): ${name}</td></tr>
        </table>
      `;
    }

    function render() {
      el('paper').innerHTML = buildLetter();
    }

    function bindLive() {
      document.querySelectorAll('#leaveType, #dateSingle, #dateFrom, #dateTo, #numDays, #session, #joiningLeaveType, #joiningCustomText, #joiningResumeDate, #joiningSession, #reasonPreset, #reasonCustom, #duration, #addresseePreset, #addresseeCustom, #applicantName, #designationPreset, #designationCustom, #attendanceId, #copyTo, #fiPost, #fiOffice, #fiGrounds, #fiPrefix, #fiAddress')
        .forEach(node => {
          if (!node) return;
          node.addEventListener('input', () => { render(); saveUserProfile(); });
          node.addEventListener('change', () => { render(); saveUserProfile(); });
        });

      // Bi-directional calendar auto-calculation
      // Bi-directional sync for Number of Days (Casual Leave - Multiple Days)
      el('numDays').addEventListener('input', () => {
        const days = parseInt(el('numDays').value, 10);
        if (days > 0 && el('dateFrom').value) {
          el('dateTo').value = addDays(el('dateFrom').value, days - 1);
          el('joiningResumeDate').value = addDays(el('dateTo').value, 1);
        }
        render();
      });

      // Bi-directional sync for Duration (Earned Leave)
      el('duration').addEventListener('input', () => {
        const raw = el('duration').value.trim();
        const days = parseInt(raw, 10);
        if (!isNaN(days) && days > 0 && el('dateFrom').value) {
          el('dateTo').value = addDays(el('dateFrom').value, days - 1);
          el('joiningResumeDate').value = addDays(el('dateTo').value, 1);
        }
        render();
      });

      // When "From" date changes
      el('dateFrom').addEventListener('change', () => {
        const type = el('leaveType').value;
        if (type === 'casualN') {
          const days = parseInt(el('numDays').value, 10) || 1;
          el('dateTo').value = addDays(el('dateFrom').value, days - 1);
        } else if (type === 'earnedLetter') {
          const rawDays = parseInt(el('duration').value, 10);
          if (!isNaN(rawDays) && rawDays > 0) {
            el('dateTo').value = addDays(el('dateFrom').value, rawDays - 1);
          } else {
            const span = diffDaysInclusive(el('dateFrom').value, el('dateTo').value);
            el('duration').value = `${span} days`;
          }
        } else {
          el('numDays').value = diffDaysInclusive(el('dateFrom').value, el('dateTo').value);
        }
        el('joiningResumeDate').value = addDays(el('dateTo').value, 1);
        render();
      });

      // When "To" date changes
      el('dateTo').addEventListener('change', () => {
        if (el('dateFrom').value) {
          const days = diffDaysInclusive(el('dateFrom').value, el('dateTo').value);
          el('numDays').value = days;
          if (el('leaveType').value === 'earnedLetter') {
            el('duration').value = `${days} days`;
          }
        }
        el('joiningResumeDate').value = addDays(el('dateTo').value, 1);
        render();
      });
      el('leaveType').addEventListener('change', e => {
        toggleFieldsForType(e.target.value);
        render();
      });
      el('joiningLeaveType').addEventListener('change', () => {
        el('joiningCustomField').style.display = el('joiningLeaveType').value === 'custom' ? '' : 'none';
        render();
      });
      el('reasonPreset').addEventListener('change', () => {
        toggleFieldsForType(el('leaveType').value);
        render();
      });
      el('addresseePreset').addEventListener('change', () => {
        el('addresseeCustomField').style.display = el('addresseePreset').value === 'custom' ? '' : 'none';
        render();
      });
      el('designationPreset').addEventListener('change', () => {
        el('designationCustomField').style.display = el('designationPreset').value === 'custom' ? '' : 'none';
        render();
      });

      document.querySelectorAll('.btn-align').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.btn-align').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTextAlign = btn.dataset.align;
          applyPaperStyle();
        });
      });
    }

    /* ---------- Robust Local Storage (IndexedDB) & Security Layer ---------- */

    const DB_NAME = 'ArziSignaturesDB';
    const DB_VERSION = 1;
    const STORE_NAME = 'signatures';
    const SIG_LIMIT = 40;
    const MAX_SIGNATURE_WIDTH = 480;

    let camStream = null;
    let rawImageForCrop = null;
    let cropRect = null;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function isValidSignatureDataUrl(dataUrl) {
      if (typeof dataUrl !== 'string') return false;
      return /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(dataUrl);
    }

    async function loadSignatures() {
      try {
        const db = await openDatabase();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.getAll();
          req.onsuccess = () => {
            const list = (req.result || [])
              .map(item => item.data)
              .filter(isValidSignatureDataUrl);
            resolve(list);
          };
          req.onerror = () => resolve(fallbackLoadLocal());
        });
      } catch (err) {
        return fallbackLoadLocal();
      }
    }

    function fallbackLoadLocal() {
      try {
        const list = JSON.parse(localStorage.getItem('arzi_signatures_v1')) || [];
        return Array.isArray(list) ? list.filter(isValidSignatureDataUrl) : [];
      } catch {
        return [];
      }
    }

    async function saveSignatures(list) {
      const sanitized = list.filter(isValidSignatureDataUrl);
      try {
        const db = await openDatabase();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.clear();
        sanitized.forEach((data, index) => {
          store.put({ id: index + 1, data: data, updatedAt: Date.now() });
        });
      } catch (err) {
        console.warn('Falling back to localStorage:', err);
      }
      try {
        localStorage.setItem('arzi_signatures_v1', JSON.stringify(sanitized));
      } catch (e) {}
    }

    function setCurrentSignature(dataUrl) {
      if (dataUrl && !isValidSignatureDataUrl(dataUrl)) return;
      signatureDataUrl = dataUrl;
      el('sigPreview').innerHTML = dataUrl ? `<img src="${dataUrl}">` : 'no signature selected';
      el('sigSaveToLibrary').disabled = !dataUrl;
      renderLibrary();
      render();
    }

    async function renderLibrary() {
      const list = await loadSignatures();
      el('sigLibCount').textContent = `Saved signatures: ${list.length} / ${SIG_LIMIT}`;
      const wrap = el('sigLibrary');
      wrap.innerHTML = '';

      list.forEach((dataUrl) => {
        const item = document.createElement('div');
        item.className = 'sig-lib-item' + (dataUrl === signatureDataUrl ? ' selected' : '');
        
        const img = document.createElement('img');
        img.src = dataUrl;
        img.addEventListener('click', () => setCurrentSignature(dataUrl));

        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'sig-lib-remove';
        removeBtn.innerHTML = '&times;';
        removeBtn.title = 'Remove';
        removeBtn.addEventListener('click', async (ev) => {
          ev.stopPropagation();
          const currentList = await loadSignatures();
          const updated = currentList.filter(s => s !== dataUrl);
          await saveSignatures(updated);
          if (signatureDataUrl === dataUrl) setCurrentSignature(null);
          else renderLibrary();
        });

        item.appendChild(img);
        item.appendChild(removeBtn);
        wrap.appendChild(item);
      });
    }

    el('sigSaveToLibrary').addEventListener('click', async () => {
      if (!signatureDataUrl || !isValidSignatureDataUrl(signatureDataUrl)) return;
      let list = await loadSignatures();
      if (list.includes(signatureDataUrl)) return;
      if (list.length >= SIG_LIMIT) list.shift();
      list.push(signatureDataUrl);
      await saveSignatures(list);
      renderLibrary();
    });

    // Local Backup (.json File Export)
    el('sigExportBackup').addEventListener('click', async () => {
      const list = await loadSignatures();
      if (list.length === 0) {
        alert('No signatures to export yet.');
        return;
      }
      const payload = {
        app: 'Arzi Leave Application',
        version: 1,
        exportedAt: new Date().toISOString(),
        signatures: list
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const dlLink = document.createElement('a');
      dlLink.href = URL.createObjectURL(blob);
      dlLink.download = `arzi-signatures-backup-${new Date().toISOString().slice(0,10)}.json`;
      dlLink.click();
      URL.revokeObjectURL(dlLink.href);
    });

    // Local Backup (.json File Import)
    el('sigImportBackupTrigger').addEventListener('click', () => {
      el('sigImportFile').click();
    });

    el('sigImportFile').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (evt) => {
        try {
          const parsed = JSON.parse(evt.target.result);
          const imported = Array.isArray(parsed) ? parsed : parsed.signatures;
          if (!Array.isArray(imported)) throw new Error('Invalid file structure');

          const safeSignatures = imported.filter(isValidSignatureDataUrl);
          if (safeSignatures.length === 0) {
            alert('No valid signatures found in this backup file.');
            return;
          }

          let current = await loadSignatures();
          safeSignatures.forEach(sig => {
            if (!current.includes(sig) && current.length < SIG_LIMIT) {
              current.push(sig);
            }
          });

          await saveSignatures(current);
          renderLibrary();
          alert(`Successfully imported ${safeSignatures.length} signature(s).`);
        } catch (err) {
          alert('Could not import signatures: invalid or corrupted JSON file.');
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsText(file);
    });

    // Tabs
    document.querySelectorAll('.sig-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sig-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        el('sigPanelUpload').style.display = tab.dataset.tab === 'upload' ? '' : 'none';
        el('sigPanelScan').style.display = tab.dataset.tab === 'scan' ? '' : 'none';
        if (tab.dataset.tab !== 'scan') stopCamera();
      });
    });

    // Upload
    el('sigUpload').addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('Only valid image files can be selected.');
        return;
      }
      const reader = new FileReader();
      reader.onload = ev => openCropper(ev.target.result);
      reader.readAsDataURL(file);
    });

    // Camera
    async function startCamera() {
      try {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        el('sigVideo').srcObject = camStream;
        el('sigCapture').disabled = false;
      } catch (err) {
        alert('Could not access the camera: ' + err.message);
      }
    }
    function stopCamera() {
      if (camStream) {
        camStream.getTracks().forEach(t => t.stop());
        camStream = null;
        el('sigCapture').disabled = true;
      }
    }
    el('sigStartCam').addEventListener('click', startCamera);
    el('sigCapture').addEventListener('click', () => {
      const video = el('sigVideo');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);
      openCropper(canvas.toDataURL('image/png'));
      stopCamera();
    });

    // Crop tool
    function openCropper(dataUrl) {
      rawImageForCrop = dataUrl;
      const img = el('sigCropImage');
      img.src = dataUrl;
      el('sigCropWrap').style.display = '';
      el('sigCropRect').style.display = 'none';
      cropRect = null;
    }

    el('sigCropCancel').addEventListener('click', () => {
      el('sigCropWrap').style.display = 'none';
      rawImageForCrop = null;
    });

    (function initCropDrag() {
      const container = el('sigCropContainer');
      const rectEl = el('sigCropRect');
      let dragging = false, startX = 0, startY = 0;

      function pointerPos(e) {
        const box = container.getBoundingClientRect();
        const cx = (e.touches ? e.touches[0].clientX : e.clientX) - box.left;
        const cy = (e.touches ? e.touches[0].clientY : e.clientY) - box.top;
        return { x: Math.max(0, Math.min(cx, box.width)), y: Math.max(0, Math.min(cy, box.height)) };
      }

      function begin(e) {
        if (e.cancelable) e.preventDefault();
        const p = pointerPos(e);
        dragging = true;
        startX = p.x; startY = p.y;
        rectEl.style.display = 'block';
        rectEl.style.left = startX + 'px';
        rectEl.style.top = startY + 'px';
        rectEl.style.width = '0px';
        rectEl.style.height = '0px';
      }
      function move(e) {
        if (!dragging) return;
        if (e.cancelable) e.preventDefault();
        const p = pointerPos(e);
        const x = Math.min(startX, p.x), y = Math.min(startY, p.y);
        const w = Math.abs(p.x - startX), h = Math.abs(p.y - startY);
        rectEl.style.left = x + 'px';
        rectEl.style.top = y + 'px';
        rectEl.style.width = w + 'px';
        rectEl.style.height = h + 'px';
        cropRect = { x, y, w, h };
      }
      function end(e) { if (e.cancelable) e.preventDefault(); dragging = false; }

      container.addEventListener('mousedown', begin);
      container.addEventListener('mousemove', move);
      container.addEventListener('mouseup', end);
      container.addEventListener('touchstart', begin, { passive: false });
      container.addEventListener('touchmove', move, { passive: false });
      container.addEventListener('touchend', end, { passive: false });
    })();

    el('sigCropUse').addEventListener('click', () => {
      const img = el('sigCropImage');
      if (!cropRect || cropRect.w < 4 || cropRect.h < 4) {
        alert('Drag a box around the signature first.');
        return;
      }
      const scaleX = img.naturalWidth / img.clientWidth;
      const scaleY = img.naturalHeight / img.clientHeight;

      const sx = cropRect.x * scaleX, sy = cropRect.y * scaleY;
      const sw = cropRect.w * scaleX, sh = cropRect.h * scaleY;

      const downScale = sw > MAX_SIGNATURE_WIDTH ? (MAX_SIGNATURE_WIDTH / sw) : 1;
      const finalW = Math.round(sw * downScale);
      const finalH = Math.round(sh * downScale);

      const canvas = document.createElement('canvas');
      canvas.width = finalW; 
      canvas.height = finalH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, finalW, finalH);

      if (el('sigTransparent').checked) {
        const data = ctx.getImageData(0, 0, finalW, finalH);
        const d = data.data;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i] > 200 && d[i+1] > 200 && d[i+2] > 200) d[i+3] = 0;
        }
        ctx.putImageData(data, 0, 0);
      }

      setCurrentSignature(canvas.toDataURL('image/png'));
      el('sigCropWrap').style.display = 'none';
    });

    /* ---------- Accurate Full-Document Capture & Multi-Page PDF Generation ---------- */

    async function captureFullPaperCanvas() {
      const paper = el('paper');
      const clone = paper.cloneNode(true);

      clone.style.position = 'fixed';
      clone.style.left = '-9999px';
      clone.style.top = '0';
      clone.style.width = paper.clientWidth + 'px';
      clone.style.height = 'auto';
      clone.style.minHeight = 'auto';
      clone.style.maxHeight = 'none';
      clone.style.aspectRatio = 'auto';
      clone.style.overflow = 'visible';
      clone.style.boxShadow = 'none';
      clone.style.border = 'none';
      clone.style.zIndex = '-9999';

      document.body.appendChild(clone);

      try {
        const canvas = await html2canvas(clone, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false
        });
        return canvas;
      } finally {
        document.body.removeChild(clone);
      }
    }

    async function exportImage() {
      const btn = el('export-image');
      btn.disabled = true;
      btn.textContent = 'Exporting…';
      try {
        const canvas = await captureFullPaperCanvas();
        const link = document.createElement('a');
        link.download = 'leave-application.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save as Image';
      }
    }

    let pendingPdf = null;

    function sliceCanvasToPages(canvas, imgWidthPt, contentHeightPt) {
      const pxPerPt = canvas.width / imgWidthPt;
      const pagePxHeight = Math.max(1, Math.floor(contentHeightPt * pxPerPt));
      const pages = [];
      let y = 0;

      while (y < canvas.height) {
        const sliceH = Math.min(pagePxHeight, canvas.height - y);
        const pageCanvas = document.createElement('canvas');
        pageCanvas.width = canvas.width;
        pageCanvas.height = sliceH;
        const ctx = pageCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
        ctx.drawImage(canvas, 0, y, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        pages.push(pageCanvas);
        y += sliceH;
      }
      return pages;
    }

    async function buildPdfAndPages() {
      const canvas = await captureFullPaperCanvas();
      const { jsPDF } = window.jspdf;
      const formatKey = el('pageSize').value;
      const pdf = new jsPDF({ unit: 'pt', format: formatKey });
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      const margin = 36;
      const imgWidthPt = pageWidth - margin * 2;
      const contentHeightPt = pageHeight - margin * 2;

      const pageCanvases = sliceCanvasToPages(canvas, imgWidthPt, contentHeightPt);

      pageCanvases.forEach((pc, i) => {
        if (i > 0) pdf.addPage();
        const sliceHeightPt = (pc.height / canvas.width) * imgWidthPt;
        pdf.addImage(pc.toDataURL('image/png'), 'PNG', margin, margin, imgWidthPt, sliceHeightPt);
      });

      return { pdf, pageCanvases };
    }

    async function previewPdf() {
      const btn = el('export-pdf');
      btn.disabled = true;
      btn.textContent = 'Preparing…';
      try {
        const { pdf, pageCanvases } = await buildPdfAndPages();
        pendingPdf = pdf;

        const wrap = el('pdfPreviewPages');
        wrap.innerHTML = '';
        pageCanvases.forEach((pc, i) => {
          const label = document.createElement('div');
          label.className = 'pdf-page-label';
          label.textContent = `Page ${i + 1} of ${pageCanvases.length}`;
          const img = document.createElement('img');
          img.src = pc.toDataURL('image/png');
          wrap.appendChild(label);
          wrap.appendChild(img);
        });

        el('pdfModal').style.display = 'flex';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save as PDF';
      }
    }

    el('pdfModalClose').addEventListener('click', () => {
      el('pdfModal').style.display = 'none';
    });
    el('pdfModalDownload').addEventListener('click', () => {
      if (pendingPdf) pendingPdf.save('leave-application.pdf');
    });

    document.getElementById('export-image').addEventListener('click', exportImage);
    document.getElementById('export-pdf').addEventListener('click', previewPdf);

    function applyPaperStyle() {
      const paper = el('paper');
      paper.style.fontFamily = el('fontFamily').value;

      let sizeVal = parseInt(el('fontSize').value, 10);
      if (isNaN(sizeVal) || sizeVal < 1) sizeVal = 16;
      if (sizeVal > 40) sizeVal = 40;
      paper.style.fontSize = sizeVal + 'px';

      paper.style.color = el('fontColor').value;
      paper.style.textAlign = currentTextAlign;

      const sel = el('pageSize');
      const ratio = sel.options[sel.selectedIndex].dataset.ratio;
      paper.style.aspectRatio = ratio;
    }

    el('fontFamily').addEventListener('change', applyPaperStyle);
    el('fontSize').addEventListener('input', applyPaperStyle);
    el('fontSize').addEventListener('change', applyPaperStyle);
    el('fontColor').addEventListener('input', applyPaperStyle);
    el('pageSize').addEventListener('change', applyPaperStyle);

    loadUserProfile();
    initDefaultDates();
    toggleFieldsForType('casual1');
    bindLive();
    renderLibrary();
    applyPaperStyle();
    render();
    const sigSlider = document.getElementById('sigSizeSlider');
    if (sigSlider) {
      sigSlider.addEventListener('input', (e) => {
        const val = e.target.value + 'px';
        document.querySelectorAll('.paper .sig-img').forEach(img => {
          img.style.maxHeight = val;
        });
        const label = document.getElementById('sigSizeVal');
        if (label) label.textContent = val;
      });
    }
  </script>

</body>
