<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organise PDF Pages | Arzi Lab</title>
<meta name="description" content="Drag to reorder, rotate individual pages, or remove pages from a PDF, right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lab.css">
<style>
  .rot-badge{
    position:absolute; top:.35rem; left:.35rem; background:var(--seal); color:var(--paper-white);
    font-size:.68rem; font-weight:700; border-radius:3px; padding:.1rem .35rem; display:none;
  }
  .rot-badge.show{ display:block; }
  .toolbar-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.6rem; margin-top:1rem;}
</style>
</head>
<body>

<header class="lab-topbar">
  <a class="lab-brand" href="../../index.html"><span class="mark">Ar<span>zi</span></span></a>
  <span class="lab-crumb"><a href="../lab.html">The Lab</a> / Organise pages</span>
</header>

<main class="lab-main wide">
  <h1 class="lab-title">Organise pages</h1>
  <p class="lab-sub">Open a PDF, then drag pages into a new order, rotate individual pages, or mark pages to remove.</p>
  <span class="lab-privacy">🔒 Runs on your device — nothing is uploaded</span>

  <div class="bench">
    <div class="dropzone" id="dz" tabindex="0">
      <input type="file" id="fileInput" accept="application/pdf">
      <div class="dz-title">Drop a PDF here, or tap to choose</div>
      <div class="dz-sub">One file at a time</div>
    </div>
    <div id="fileChipHolder"></div>

    <div class="status-line" id="loadStatus"></div>
    <div class="page-grid" id="grid"></div>

    <div id="options" style="display:none;">
      <div class="toolbar-row">
        <span class="status-line" id="countLine" style="margin:0;"></span>
        <button class="btn secondary" id="resetBtn">Reset all changes</button>
      </div>
      <button class="btn seal" id="runBtn" style="margin-top:1rem;">Apply &amp; download</button>
      <div class="progress" id="progress"><i></i></div>
      <div class="status-line" id="statusLine"></div>
      <div class="result" id="resultBox">
        <div class="r-title" id="resultTitle"></div>
        <div class="r-meta" id="resultMeta"></div>
        <div class="btn-row"><button class="btn" id="downloadBtn">Download PDF</button></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../lab-common.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const dz = document.getElementById('dz');
  const fileInput = document.getElementById('fileInput');
  const grid = document.getElementById('grid');
  const optionsBox = document.getElementById('options');
  let currentFile = null;
  let originalBytes = null;
  let pages = []; // { origIndex, rotation, removed, dataUrl, id }
  let dragSrc = null;

  wireDropzone(dz, fileInput, { onFiles: (files) => loadFile(files[0]) });

  async function loadFile(file){
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
      toast('Please choose a PDF file', 'error'); return;
    }
    currentFile = file;
    document.getElementById('fileChipHolder').innerHTML = '';
    const chip = el('div', 'file-chip');
    chip.innerHTML = `<span class="name">${file.name}</span><span class="meta">${formatBytes(file.size)}</span>`;
    document.getElementById('fileChipHolder').appendChild(chip);

    document.getElementById('loadStatus').textContent = 'Reading pages…';
    grid.innerHTML = '';
    optionsBox.style.display = 'none';

    originalBytes = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: originalBytes.slice(0) }).promise;
    pages = [];

    for (let i = 1; i <= pdf.numPages; i++){
      const page = await pdf.getPage(i);
      const vp1 = page.getViewport({ scale: 1 });
      const scale = 200 / vp1.width;
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      pages.push({
        id: 'p' + i,
        origIndex: i - 1,
        rotation: 0,
        removed: false,
        dataUrl: canvas.toDataURL('image/jpeg', 0.7)
      });
      document.getElementById('loadStatus').textContent = `Reading pages… ${i}/${pdf.numPages}`;
    }

    document.getElementById('loadStatus').textContent = '';
    optionsBox.style.display = '';
    document.getElementById('resultBox').classList.remove('show');
    render();
  }

  function render(){
    grid.innerHTML = '';
    pages.forEach((p, idx) => {
      const tile = el('div', 'page-tile' + (p.removed ? ' marked' : ''));
      tile.draggable = true;
      tile.dataset.id = p.id;

      const img = document.createElement('img');
      img.src = p.dataUrl;
      tile.appendChild(img);

      const badge = el('div', 'rot-badge' + (p.rotation ? ' show' : ''), p.rotation + '°');
      tile.appendChild(badge);

      const num = el('div', 'p-num', `Page ${idx + 1} (was ${p.origIndex + 1})`);
      tile.appendChild(num);

      const actions = el('div', 'p-actions');
      const rotBtn = el('button', 'p-btn', '↻');
      rotBtn.title = 'Rotate 90°';
      rotBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        p.rotation = (p.rotation + 90) % 360;
        render();
      });
      const delBtn = el('button', 'p-btn', p.removed ? '↺' : '×');
      delBtn.title = p.removed ? 'Restore page' : 'Remove page';
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        p.removed = !p.removed;
        render();
      });
      actions.appendChild(rotBtn);
      actions.appendChild(delBtn);
      tile.appendChild(actions);

      tile.addEventListener('dragstart', () => { dragSrc = p.id; tile.classList.add('dragging'); });
      tile.addEventListener('dragend', () => tile.classList.remove('dragging'));
      tile.addEventListener('dragover', (e) => { e.preventDefault(); tile.classList.add('drag-over'); });
      tile.addEventListener('dragleave', () => tile.classList.remove('drag-over'));
      tile.addEventListener('drop', (e) => {
        e.preventDefault();
        tile.classList.remove('drag-over');
        if (!dragSrc || dragSrc === p.id) return;
        const fromIdx = pages.findIndex(x => x.id === dragSrc);
        const toIdx = pages.findIndex(x => x.id === p.id);
        const [moved] = pages.splice(fromIdx, 1);
        pages.splice(toIdx, 0, moved);
        render();
      });

      grid.appendChild(tile);
    });

    const remaining = pages.filter(p => !p.removed).length;
    document.getElementById('countLine').textContent = `${remaining} of ${pages.length} pages will be kept`;
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    pages.forEach(p => { p.rotation = 0; p.removed = false; });
    pages.sort((a, b) => a.origIndex - b.origIndex);
    render();
  });

  document.getElementById('runBtn').addEventListener('click', async () => {
    const kept = pages.filter(p => !p.removed);
    if (kept.length === 0){ toast('At least one page must remain', 'error'); return; }
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    document.getElementById('statusLine').textContent = 'Building your PDF…';

    try {
      const { PDFDocument, degrees } = PDFLib;
      const srcDoc = await PDFDocument.load(originalBytes, { ignoreEncryption: true });
      const outDoc = await PDFDocument.create();

      const indices = kept.map(p => p.origIndex);
      const copied = await outDoc.copyPages(srcDoc, indices);
      copied.forEach((page, i) => {
        const extra = kept[i].rotation;
        if (extra) page.setRotation(degrees((page.getRotation().angle + extra) % 360));
        outDoc.addPage(page);
      });

      setProgress(document.getElementById('progress'), 100);
      const outBytes = await outDoc.save();
      const blob = new Blob([outBytes], { type: 'application/pdf' });

      document.getElementById('resultTitle').textContent = 'Ready';
      document.getElementById('resultMeta').textContent = `${kept.length} pages · ${formatBytes(blob.size)}`;
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('resultBox').dataset.blobReady = '1';
      document.getElementById('downloadBtn').onclick = () => downloadBlob(blob, 'organised.pdf');
      document.getElementById('statusLine').textContent = '';
    } catch (e){
      console.error(e);
      toast('Could not process this PDF — it may be password protected', 'error');
      document.getElementById('statusLine').textContent = '';
    }
    btn.disabled = false;
  });
</script>
</body>
</html>
