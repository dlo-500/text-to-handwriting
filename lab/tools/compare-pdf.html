<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compare PDF | Arzi Lab</title>
<meta name="description" content="Show two PDFs side by side, or highlight pixel differences between them, right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lab.css">
<style>
  .two-col{ display:flex; gap:1rem; flex-wrap:wrap; }
  .two-col .field{ flex:1; min-width:200px; }
  .side-stage{ display:flex; gap:.8rem; margin-top:1rem; overflow-x:auto; }
  .side-pane{ flex:1; min-width:260px; }
  .side-pane .lbl{ font-size:.78rem; color:var(--ink-soft); margin-bottom:.4rem; text-align:center; }
  .side-pane canvas{ width:100%; height:auto; display:block; border:1px solid var(--paper-line); border-radius:var(--radius-s); background:#fff; }
  .diff-stage canvas{ max-width:100%; height:auto; display:block; border:1px solid var(--paper-line); border-radius:var(--radius-s); background:#fff; margin:1rem auto 0; }
  .page-nav{ display:flex; align-items:center; justify-content:center; gap:1rem; margin-top:1rem; }
</style>
</head>
<body>

<header class="lab-topbar">
  <a class="lab-brand" href="../../index.html"><span class="mark">Ar<span>zi</span></span></a>
  <span class="lab-crumb"><a href="../lab.html">The Lab</a> / Compare PDF</span>
</header>

<main class="lab-main">
  <h1 class="lab-title">Compare PDF</h1>
  <p class="lab-sub">Load two versions of a document to view them side by side, or highlight exactly where they differ.</p>
  <span class="lab-privacy">🔒 Runs on your device — nothing is uploaded</span>

  <div class="bench">
    <div class="two-col">
      <div class="field">
        <label>Original</label>
        <div class="dropzone" id="dzA" tabindex="0" style="padding:1.2rem;">
          <input type="file" id="fileInputA" accept="application/pdf">
          <div class="dz-title">Drop or tap</div>
        </div>
        <div id="chipA"></div>
      </div>
      <div class="field">
        <label>Revised</label>
        <div class="dropzone" id="dzB" tabindex="0" style="padding:1.2rem;">
          <input type="file" id="fileInputB" accept="application/pdf">
          <div class="dz-title">Drop or tap</div>
        </div>
        <div id="chipB"></div>
      </div>
    </div>

    <div id="viewer" style="display:none; margin-top:1.4rem;">
      <div class="radio-group">
        <label class="radio-pill active"><input type="radio" name="mode" value="side" checked>Side by side</label>
        <label class="radio-pill"><input type="radio" name="mode" value="diff">Highlight differences</label>
      </div>

      <div id="sideView" class="side-stage">
        <div class="side-pane">
          <div class="lbl">Original</div>
          <canvas id="canvasA"></canvas>
        </div>
        <div class="side-pane">
          <div class="lbl">Revised</div>
          <canvas id="canvasB"></canvas>
        </div>
      </div>

      <div id="diffView" class="diff-stage" style="display:none;">
        <canvas id="canvasDiff"></canvas>
        <p class="hint" style="text-align:center; font-size:.8rem; color:var(--ink-soft); margin-top:.5rem;">Areas that differ between the two pages are highlighted in red.</p>
      </div>

      <div class="page-nav">
        <button class="btn secondary" id="prevBtn">←</button>
        <span id="pageLabel" style="font-size:.85rem; color:var(--ink-soft);"></span>
        <button class="btn secondary" id="nextBtn">→</button>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="../lab-common.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let docA = null, docB = null, pageCount = 0, currentPage = 0;

  function wireSide(dzId, inputId, chipId, isA){
    const dz = document.getElementById(dzId);
    const input = document.getElementById(inputId);
    wireDropzone(dz, input, { onFiles: async (files) => {
      const file = files[0];
      if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
        toast('Please choose a PDF file', 'error'); return;
      }
      const holder = document.getElementById(chipId);
      holder.innerHTML = '';
      const chip = el('div', 'file-chip');
      chip.innerHTML = `<span class="name">${file.name}</span><span class="meta">${formatBytes(file.size)}</span>`;
      holder.appendChild(chip);

      const bytes = await file.arrayBuffer();
      const doc = await pdfjsLib.getDocument({ data: bytes }).promise;
      if (isA) docA = doc; else docB = doc;
      maybeReady();
    }});
  }
  wireSide('dzA', 'fileInputA', 'chipA', true);
  wireSide('dzB', 'fileInputB', 'chipB', false);

  function maybeReady(){
    if (!docA || !docB) return;
    pageCount = Math.max(docA.numPages, docB.numPages);
    currentPage = 0;
    document.getElementById('viewer').style.display = '';
    render();
  }

  document.querySelectorAll('input[name=mode]').forEach(inp => {
    inp.addEventListener('change', () => {
      document.querySelectorAll('input[name=mode]').forEach(i => i.closest('.radio-pill').classList.toggle('active', i.checked));
      const mode = document.querySelector('input[name=mode]:checked').value;
      document.getElementById('sideView').style.display = mode === 'side' ? '' : 'none';
      document.getElementById('diffView').style.display = mode === 'diff' ? '' : 'none';
      render();
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => { if (currentPage > 0){ currentPage--; render(); } });
  document.getElementById('nextBtn').addEventListener('click', () => { if (currentPage < pageCount - 1){ currentPage++; render(); } });

  async function renderPageToCanvas(doc, pageNum, targetWidth){
    if (pageNum > doc.numPages) return null;
    const page = await doc.getPage(pageNum);
    const vp1 = page.getViewport({ scale: 1 });
    const scale = targetWidth / vp1.width;
    const viewport = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport }).promise;
    return canvas;
  }

  async function render(){
    document.getElementById('pageLabel').textContent = `Page ${currentPage + 1} of ${pageCount}`;
    const mode = document.querySelector('input[name=mode]:checked').value;
    const pageNum = currentPage + 1;

    if (mode === 'side'){
      const [ca, cb] = await Promise.all([
        renderPageToCanvas(docA, pageNum, 480),
        renderPageToCanvas(docB, pageNum, 480)
      ]);
      drawInto('canvasA', ca);
      drawInto('canvasB', cb);
    } else {
      const [ca, cb] = await Promise.all([
        renderPageToCanvas(docA, pageNum, 700),
        renderPageToCanvas(docB, pageNum, 700)
      ]);
      const w = Math.max(ca ? ca.width : 0, cb ? cb.width : 0);
      const h = Math.max(ca ? ca.height : 0, cb ? cb.height : 0);
      const diffCanvas = document.getElementById('canvasDiff');
      diffCanvas.width = w; diffCanvas.height = h;
      const dctx = diffCanvas.getContext('2d');
      dctx.fillStyle = '#fff'; dctx.fillRect(0, 0, w, h);

      if (!ca || !cb){
        dctx.fillStyle = '#8a2e24';
        dctx.font = '16px sans-serif';
        dctx.fillText(!ca ? 'No corresponding page in the original' : 'No corresponding page in the revised file', 20, 30);
        return;
      }

      const bufA = document.createElement('canvas'); bufA.width = w; bufA.height = h;
      bufA.getContext('2d').drawImage(ca, 0, 0);
      const bufB = document.createElement('canvas'); bufB.width = w; bufB.height = h;
      bufB.getContext('2d').drawImage(cb, 0, 0);
      const dataA = bufA.getContext('2d').getImageData(0, 0, w, h);
      const dataB = bufB.getContext('2d').getImageData(0, 0, w, h);
      const out = dctx.createImageData(w, h);

      for (let i = 0; i < dataA.data.length; i += 4){
        const diff = Math.abs(dataA.data[i] - dataB.data[i]) + Math.abs(dataA.data[i+1] - dataB.data[i+1]) + Math.abs(dataA.data[i+2] - dataB.data[i+2]);
        if (diff > 40){
          out.data[i] = 220; out.data[i+1] = 40; out.data[i+2] = 36; out.data[i+3] = 255;
        } else {
          const gray = 235 + (dataA.data[i] * 0.05);
          out.data[i] = out.data[i+1] = out.data[i+2] = Math.min(250, gray);
          out.data[i+3] = 255;
        }
      }
      dctx.putImageData(out, 0, 0);
    }
  }

  function drawInto(canvasId, srcCanvas){
    const canvas = document.getElementById(canvasId);
    if (!srcCanvas){
      canvas.width = 300; canvas.height = 200;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#f4efe2'; ctx.fillRect(0, 0, 300, 200);
      ctx.fillStyle = '#8a2e24'; ctx.font = '14px sans-serif';
      ctx.fillText('No page here', 90, 100);
      return;
    }
    canvas.width = srcCanvas.width; canvas.height = srcCanvas.height;
    canvas.getContext('2d').drawImage(srcCanvas, 0, 0);
  }
</script>
</body>
</html>
