<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checksum (SHA-256) | Arzi Lab</title>
<meta name="description" content="Hash a file on this device with SHA-256, or compare two files after signing, right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lab.css">
<style>
  .hash-out{
    font-family:'JetBrains Mono', monospace; font-size:.86rem; word-break:break-all;
    background:var(--paper); border:1px solid var(--paper-line); border-radius:var(--radius-s);
    padding:.8rem .9rem; margin-top:.6rem; user-select:all;
  }
  .match-banner{
    display:flex; align-items:center; gap:.6rem; padding:.9rem 1.1rem; border-radius:var(--radius-s);
    font-weight:600; margin-top:1rem;
  }
  .match-banner.yes{ background:var(--success-dim); color:var(--success); border:1px solid #c3d6c6; }
  .match-banner.no{ background:var(--seal-dim); color:var(--seal); border:1px solid #dfb3a9; }
</style>
</head>
<body>

<header class="lab-topbar">
  <a class="lab-brand" href="../../index.html"><span class="mark">Ar<span>zi</span></span></a>
  <span class="lab-crumb"><a href="../lab.html">The Lab</a> / Checksum</span>
</header>

<main class="lab-main">
  <h1 class="lab-title">Checksum (SHA-256)</h1>
  <p class="lab-sub">Hash a file to verify it hasn't changed, or compare two files — useful after signing, printing and rescanning, or emailing a copy.</p>
  <span class="lab-privacy">🔒 Runs on your device — nothing is uploaded</span>

  <div class="bench">
    <div class="radio-group" id="modeGroup" style="margin-bottom:1.4rem;">
      <label class="radio-pill active"><input type="radio" name="mode" value="one" checked>Hash one file</label>
      <label class="radio-pill"><input type="radio" name="mode" value="two">Compare two files</label>
    </div>

    <div id="panelOne">
      <div class="dropzone" id="dz1" tabindex="0">
        <input type="file" id="fileInput1">
        <div class="dz-title">Drop a file here, or tap to choose</div>
        <div class="dz-sub">Any file type</div>
      </div>
      <div id="chip1"></div>
      <div class="hash-out" id="hash1" style="display:none;"></div>
      <button class="btn secondary" id="copy1" style="display:none; margin-top:.6rem;">Copy hash</button>
    </div>

    <div id="panelTwo" style="display:none;">
      <div class="row">
        <div class="field">
          <label>File A</label>
          <div class="dropzone" id="dzA" tabindex="0" style="padding:1.2rem;">
            <input type="file" id="fileInputA">
            <div class="dz-title">Drop or tap</div>
          </div>
          <div id="chipA"></div>
          <div class="hash-out" id="hashA" style="display:none;"></div>
        </div>
        <div class="field">
          <label>File B</label>
          <div class="dropzone" id="dzB" tabindex="0" style="padding:1.2rem;">
            <input type="file" id="fileInputB">
            <div class="dz-title">Drop or tap</div>
          </div>
          <div id="chipB"></div>
          <div class="hash-out" id="hashB" style="display:none;"></div>
        </div>
      </div>
      <div id="matchLine"></div>
    </div>
  </div>
</main>

<script src="../lab-common.js"></script>
<script>
  document.querySelectorAll('#modeGroup input').forEach(inp => {
    inp.addEventListener('change', () => {
      document.querySelectorAll('#modeGroup .radio-pill').forEach(p => p.classList.toggle('active', p.querySelector('input').checked));
      const mode = document.querySelector('input[name=mode]:checked').value;
      document.getElementById('panelOne').style.display = mode === 'one' ? '' : 'none';
      document.getElementById('panelTwo').style.display = mode === 'two' ? '' : 'none';
    });
  });

  async function sha256(file){
    const buf = await file.arrayBuffer();
    const digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function showChip(holderId, file){
    const holder = document.getElementById(holderId);
    holder.innerHTML = '';
    const chip = el('div', 'file-chip');
    chip.innerHTML = `<span class="name">${file.name}</span><span class="meta">${formatBytes(file.size)}</span>`;
    holder.appendChild(chip);
  }

  /* ---- one file ---- */
  const dz1 = document.getElementById('dz1');
  wireDropzone(dz1, document.getElementById('fileInput1'), { onFiles: async (files) => {
    const file = files[0];
    showChip('chip1', file);
    document.getElementById('hash1').style.display = 'none';
    document.getElementById('copy1').style.display = 'none';
    toast('Hashing…');
    const hash = await sha256(file);
    document.getElementById('hash1').textContent = hash;
    document.getElementById('hash1').style.display = '';
    document.getElementById('copy1').style.display = '';
    document.getElementById('copy1').onclick = () => {
      navigator.clipboard.writeText(hash).then(() => toast('Copied'));
    };
  }});

  /* ---- two files ---- */
  let hashA = null, hashB = null;
  function checkMatch(){
    const line = document.getElementById('matchLine');
    if (!hashA || !hashB){ line.innerHTML = ''; return; }
    const same = hashA === hashB;
    line.innerHTML = '';
    const banner = el('div', 'match-banner ' + (same ? 'yes' : 'no'),
      same ? '✓ The two files are byte-for-byte identical' : '✕ These files are different');
    line.appendChild(banner);
  }

  const dzA = document.getElementById('dzA');
  wireDropzone(dzA, document.getElementById('fileInputA'), { onFiles: async (files) => {
    const file = files[0];
    showChip('chipA', file);
    toast('Hashing…');
    hashA = await sha256(file);
    document.getElementById('hashA').textContent = hashA;
    document.getElementById('hashA').style.display = '';
    checkMatch();
  }});
  const dzB = document.getElementById('dzB');
  wireDropzone(dzB, document.getElementById('fileInputB'), { onFiles: async (files) => {
    const file = files[0];
    showChip('chipB', file);
    toast('Hashing…');
    hashB = await sha256(file);
    document.getElementById('hashB').textContent = hashB;
    document.getElementById('hashB').style.display = '';
    checkMatch();
  }});
</script>
</body>
</html>
