<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add a Watermark | Arzi Lab</title>
<meta name="description" content="Stamp DRAFT, CERTIFIED COPY, or your own text across every page of a PDF, right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lab.css">
<style>
  .preset-row{ display:flex; gap:.5rem; flex-wrap:wrap; margin-bottom:1rem; }
  .preset-btn{
    border:1px solid var(--paper-line); background:var(--paper-white); border-radius:999px;
    padding:.35rem .85rem; font-size:.8rem; cursor:pointer;
  }
  .preset-btn:hover{ border-color:var(--seal); color:var(--seal); }
</style>
</head>
<body>

<header class="lab-topbar">
  <a class="lab-brand" href="../../index.html"><span class="mark">Ar<span>zi</span></span></a>
  <span class="lab-crumb"><a href="../lab.html">The Lab</a> / Add a watermark</span>
</header>

<main class="lab-main">
  <h1 class="lab-title">Add a watermark</h1>
  <p class="lab-sub">Stamp text diagonally across every page — for drafts, certified copies, or anything that needs marking before it circulates.</p>
  <span class="lab-privacy">🔒 Runs on your device — nothing is uploaded</span>

  <div class="bench">
    <div class="dropzone" id="dz" tabindex="0">
      <input type="file" id="fileInput" accept="application/pdf">
      <div class="dz-title">Drop a PDF here, or tap to choose</div>
      <div class="dz-sub">One file at a time</div>
    </div>
    <div id="fileChipHolder"></div>

    <div id="options" style="display:none; margin-top:1.4rem;">
      <div class="preset-row">
        <button class="preset-btn" data-text="DRAFT">DRAFT</button>
        <button class="preset-btn" data-text="CERTIFIED COPY">CERTIFIED COPY</button>
        <button class="preset-btn" data-text="CONFIDENTIAL">CONFIDENTIAL</button>
        <button class="preset-btn" data-text="TRUE COPY">TRUE COPY</button>
        <button class="preset-btn" data-text="COPY">COPY</button>
      </div>

      <div class="field">
        <label for="wmText">Watermark text</label>
        <input type="text" id="wmText" value="DRAFT">
      </div>

      <div class="row">
        <div class="field">
          <label for="wmOpacity">Opacity: <span id="opVal">25%</span></label>
          <input type="range" id="wmOpacity" min="5" max="70" value="25">
        </div>
        <div class="field">
          <label for="wmAngle">Angle</label>
          <input type="number" id="wmAngle" value="45" min="-90" max="90">
        </div>
        <div class="field">
          <label for="wmColor">Colour</label>
          <select id="wmColor">
            <option value="grey" selected>Grey</option>
            <option value="red">Red</option>
            <option value="black">Black</option>
          </select>
        </div>
      </div>

      <button class="btn seal" id="runBtn">Add watermark &amp; download</button>
      <div class="progress" id="progress"><i></i></div>
      <div class="status-line" id="statusLine"></div>
      <div class="result" id="resultBox">
        <div class="r-title" id="resultTitle"></div>
        <div class="r-meta" id="resultMeta"></div>
        <div class="btn-row"><button class="btn" id="downloadBtn">Download PDF</button></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../lab-common.js"></script>
<script>
  const dz = document.getElementById('dz');
  const fileInput = document.getElementById('fileInput');
  const optionsBox = document.getElementById('options');
  let currentFile = null;
  let originalBytes = null;
  let pageCount = 0;
  let resultBlob = null;

  wireDropzone(dz, fileInput, { onFiles: (files) => loadFile(files[0]) });

  async function loadFile(file){
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
      toast('Please choose a PDF file', 'error'); return;
    }
    currentFile = file;
    document.getElementById('fileChipHolder').innerHTML = '';
    const chip = el('div', 'file-chip');
    chip.innerHTML = `<span class="name">${file.name}</span><span class="meta">${formatBytes(file.size)}</span>`;
    document.getElementById('fileChipHolder').appendChild(chip);

    originalBytes = await file.arrayBuffer();
    try {
      const { PDFDocument } = PDFLib;
      const doc = await PDFDocument.load(originalBytes, { ignoreEncryption: true });
      pageCount = doc.getPageCount();
      optionsBox.style.display = '';
      document.getElementById('resultBox').classList.remove('show');
    } catch (e){
      toast('Could not read this PDF', 'error');
    }
  }

  document.querySelectorAll('.preset-btn').forEach(b => {
    b.addEventListener('click', () => { document.getElementById('wmText').value = b.dataset.text; });
  });
  document.getElementById('wmOpacity').addEventListener('input', (e) => {
    document.getElementById('opVal').textContent = e.target.value + '%';
  });

  document.getElementById('runBtn').addEventListener('click', async () => {
    if (!originalBytes){ toast('Choose a PDF first', 'error'); return; }
    const text = document.getElementById('wmText').value.trim();
    if (!text){ toast('Enter watermark text', 'error'); return; }
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    document.getElementById('statusLine').textContent = 'Stamping pages…';

    try {
      const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
      const doc = await PDFDocument.load(originalBytes, { ignoreEncryption: true });
      const font = await doc.embedFont(StandardFonts.HelveticaBold);
      const opacity = parseInt(document.getElementById('wmOpacity').value, 10) / 100;
      const angle = parseFloat(document.getElementById('wmAngle').value) || 0;
      const colorName = document.getElementById('wmColor').value;
      const color = colorName === 'red' ? rgb(0.61, 0.23, 0.18)
                  : colorName === 'black' ? rgb(0.1, 0.1, 0.1)
                  : rgb(0.5, 0.5, 0.5);

      const pages = doc.getPages();
      pages.forEach(page => {
        const { width, height } = page.getSize();
        // size the text to comfortably span the shorter page dimension
        let size = Math.min(width, height) / Math.max(6, text.length * 0.55);
        size = Math.max(18, Math.min(size, 90));
        const textWidth = font.widthOfTextAtSize(text, size);

        page.drawText(text, {
          x: width / 2 - (textWidth / 2) * Math.cos(angle * Math.PI / 180),
          y: height / 2 - (textWidth / 2) * Math.sin(angle * Math.PI / 180),
          size,
          font,
          color,
          opacity,
          rotate: degrees(angle)
        });
      });

      setProgress(document.getElementById('progress'), 100);
      const bytes = await doc.save();
      resultBlob = new Blob([bytes], { type: 'application/pdf' });

      document.getElementById('resultTitle').textContent = 'Watermarked';
      document.getElementById('resultMeta').textContent = `${pageCount} pages · ${formatBytes(resultBlob.size)}`;
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('statusLine').textContent = '';
    } catch (e){
      console.error(e);
      toast('Could not watermark this PDF', 'error');
      document.getElementById('statusLine').textContent = '';
    }
    btn.disabled = false;
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (resultBlob){
      const base = (currentFile.name || 'document').replace(/\.pdf$/i, '');
      downloadBlob(resultBlob, `${base}-watermarked.pdf`);
    }
  });
</script>
</body>
</html>
