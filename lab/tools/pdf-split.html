<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split a PDF | Arzi Lab</title>
<meta name="description" content="Pull out a page range from a PDF, or split every page into its own file, right in your browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lab.css">
</head>
<body>

<header class="lab-topbar">
  <a class="lab-brand" href="../../index.html"><span class="mark">Ar<span>zi</span></span></a>
  <span class="lab-crumb"><a href="../lab.html">The Lab</a> / Split a PDF</span>
</header>

<main class="lab-main">
  <h1 class="lab-title">Split a PDF</h1>
  <p class="lab-sub">Pull a page range out of a PDF, or break every page into its own file.</p>
  <span class="lab-privacy">🔒 Runs on your device — nothing is uploaded</span>

  <div class="bench">
    <div class="dropzone" id="dz" tabindex="0">
      <input type="file" id="fileInput" accept="application/pdf">
      <div class="dz-title">Drop a PDF here, or tap to choose</div>
      <div class="dz-sub">One file at a time</div>
    </div>
    <div id="fileChipHolder"></div>

    <div id="options" style="display:none; margin-top:1.4rem;">
      <div class="field" id="pageCountLine" style="color:var(--ink-soft); font-size:.85rem;"></div>

      <div class="radio-group" id="modeGroup" style="margin-bottom:1.2rem;">
        <label class="radio-pill active"><input type="radio" name="mode" value="range" checked>Extract a page range</label>
        <label class="radio-pill"><input type="radio" name="mode" value="all">Split every page</label>
      </div>

      <div id="rangePanel" class="row">
        <div class="field">
          <label for="fromPage">From page</label>
          <input type="number" id="fromPage" min="1" value="1">
        </div>
        <div class="field">
          <label for="toPage">To page</label>
          <input type="number" id="toPage" min="1" value="1">
        </div>
      </div>

      <button class="btn seal" id="runBtn">Split</button>
      <div class="progress" id="progress"><i></i></div>
      <div class="status-line" id="statusLine"></div>
      <div class="result" id="resultBox">
        <div class="r-title" id="resultTitle"></div>
        <div class="r-meta" id="resultMeta"></div>
        <div class="btn-row"><button class="btn" id="downloadBtn">Download</button></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="../lab-common.js"></script>
<script>
  const dz = document.getElementById('dz');
  const fileInput = document.getElementById('fileInput');
  const optionsBox = document.getElementById('options');
  let currentFile = null;
  let originalBytes = null;
  let pageCount = 0;
  let resultBlob = null;
  let resultName = 'split.pdf';

  wireDropzone(dz, fileInput, { onFiles: (files) => loadFile(files[0]) });

  async function loadFile(file){
    if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
      toast('Please choose a PDF file', 'error'); return;
    }
    currentFile = file;
    document.getElementById('fileChipHolder').innerHTML = '';
    const chip = el('div', 'file-chip');
    chip.innerHTML = `<span class="name">${file.name}</span><span class="meta">${formatBytes(file.size)}</span>`;
    document.getElementById('fileChipHolder').appendChild(chip);

    originalBytes = await file.arrayBuffer();
    try {
      const { PDFDocument } = PDFLib;
      const doc = await PDFDocument.load(originalBytes, { ignoreEncryption: true });
      pageCount = doc.getPageCount();
      document.getElementById('pageCountLine').textContent = `${pageCount} page${pageCount === 1 ? '' : 's'} in this file`;
      document.getElementById('toPage').value = pageCount;
      document.getElementById('toPage').max = pageCount;
      document.getElementById('fromPage').max = pageCount;
      optionsBox.style.display = '';
      document.getElementById('resultBox').classList.remove('show');
    } catch (e){
      toast('Could not read this PDF', 'error');
    }
  }

  document.querySelectorAll('#modeGroup input').forEach(inp => {
    inp.addEventListener('change', () => {
      document.querySelectorAll('#modeGroup .radio-pill').forEach(p => p.classList.toggle('active', p.querySelector('input').checked));
      const mode = document.querySelector('input[name=mode]:checked').value;
      document.getElementById('rangePanel').style.display = mode === 'range' ? '' : 'none';
    });
  });

  document.getElementById('runBtn').addEventListener('click', async () => {
    if (!originalBytes){ toast('Choose a PDF first', 'error'); return; }
    const mode = document.querySelector('input[name=mode]:checked').value;
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    document.getElementById('statusLine').textContent = 'Working…';

    try {
      const { PDFDocument } = PDFLib;
      const srcDoc = await PDFDocument.load(originalBytes, { ignoreEncryption: true });
      const baseName = (currentFile.name || 'document').replace(/\.pdf$/i, '');

      if (mode === 'range'){
        let from = parseInt(document.getElementById('fromPage').value, 10);
        let to = parseInt(document.getElementById('toPage').value, 10);
        if (!from || !to || from < 1 || to > pageCount || from > to){
          toast('Enter a valid page range', 'error'); btn.disabled = false;
          document.getElementById('statusLine').textContent = '';
          return;
        }
        const indices = [];
        for (let i = from - 1; i <= to - 1; i++) indices.push(i);
        const outDoc = await PDFDocument.create();
        const copied = await outDoc.copyPages(srcDoc, indices);
        copied.forEach(p => outDoc.addPage(p));
        const bytes = await outDoc.save();
        resultBlob = new Blob([bytes], { type: 'application/pdf' });
        resultName = `${baseName}-p${from}-${to}.pdf`;
        setProgress(document.getElementById('progress'), 100);
        document.getElementById('resultTitle').textContent = 'Extracted';
        document.getElementById('resultMeta').textContent = `Pages ${from}–${to} · ${formatBytes(resultBlob.size)}`;
      } else {
        const zip = new JSZip();
        for (let i = 0; i < pageCount; i++){
          setProgress(document.getElementById('progress'), Math.round((i / pageCount) * 90));
          const outDoc = await PDFDocument.create();
          const [copied] = await outDoc.copyPages(srcDoc, [i]);
          outDoc.addPage(copied);
          const bytes = await outDoc.save();
          const num = String(i + 1).padStart(String(pageCount).length, '0');
          zip.file(`${baseName}-page-${num}.pdf`, bytes);
        }
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        resultBlob = zipBlob;
        resultName = `${baseName}-pages.zip`;
        setProgress(document.getElementById('progress'), 100);
        document.getElementById('resultTitle').textContent = 'Split';
        document.getElementById('resultMeta').textContent = `${pageCount} files, zipped · ${formatBytes(resultBlob.size)}`;
      }

      document.getElementById('resultBox').classList.add('show');
      document.getElementById('statusLine').textContent = '';
    } catch (e){
      console.error(e);
      toast('Could not split this PDF', 'error');
      document.getElementById('statusLine').textContent = '';
    }
    btn.disabled = false;
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (resultBlob) downloadBlob(resultBlob, resultName);
  });
</script>
</body>
</html>
