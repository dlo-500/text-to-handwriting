<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merge PDFs | Arzi Lab</title>
<meta name="description" content="Combine several PDFs into one file, in the order you choose.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../lab.css">
<style>
  .merge-chip{ cursor:grab; }
  .merge-chip.dragging{ opacity:.4; }
  .merge-chip.drag-over{ border-color: var(--seal); }
  .merge-chip .order{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:22px; border-radius:50%; background:var(--brass-dim); color:var(--brass);
    font-size:.72rem; font-weight:700; margin-right:.6rem; flex-shrink:0;
  }
  .chip-main{ display:flex; align-items:center; overflow:hidden; }
</style>
</head>
<body>

<header class="lab-topbar">
  <a class="lab-brand" href="../../index.html"><span class="mark">Ar<span>zi</span></span></a>
  <span class="lab-crumb"><a href="../lab.html">The Lab</a> / Merge PDFs</span>
</header>

<main class="lab-main">
  <h1 class="lab-title">Merge PDFs</h1>
  <p class="lab-sub">Add several PDFs, drag them into the order you want, and combine them into one file.</p>
  <span class="lab-privacy">🔒 Runs on your device — nothing is uploaded</span>

  <div class="bench">
    <div class="dropzone" id="dz" tabindex="0">
      <input type="file" id="fileInput" accept="application/pdf" multiple>
      <div class="dz-title">Drop PDFs here, or tap to choose</div>
      <div class="dz-sub">Add as many as you need — drag to reorder after</div>
    </div>

    <div id="list" style="margin-top:1rem;"></div>

    <div id="options" style="display:none; margin-top:1rem;">
      <button class="btn seal" id="runBtn">Merge &amp; download</button>
      <div class="progress" id="progress"><i></i></div>
      <div class="status-line" id="statusLine"></div>
      <div class="result" id="resultBox">
        <div class="r-title" id="resultTitle"></div>
        <div class="r-meta" id="resultMeta"></div>
        <div class="btn-row"><button class="btn" id="downloadBtn">Download merged PDF</button></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../lab-common.js"></script>
<script>
  const dz = document.getElementById('dz');
  const fileInput = document.getElementById('fileInput');
  const list = document.getElementById('list');
  const optionsBox = document.getElementById('options');
  let items = [];
  let resultBlob = null;
  let dragSrc = null;

  wireDropzone(dz, fileInput, { onFiles: (files) => addFiles(files) });

  function addFiles(fileList){
    let added = false;
    Array.from(fileList).forEach(f => {
      if (f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) return;
      items.push({ id: Math.random().toString(36).slice(2), file: f });
      added = true;
    });
    if (!added){ toast('Please choose PDF files', 'error'); return; }
    optionsBox.style.display = items.length >= 1 ? '' : 'none';
    document.getElementById('resultBox').classList.remove('show');
    render();
  }

  function render(){
    list.innerHTML = '';
    items.forEach((it, idx) => {
      const chip = el('div', 'file-chip merge-chip');
      chip.draggable = true;
      chip.dataset.id = it.id;

      const main = el('div', 'chip-main');
      const order = el('span', 'order', String(idx + 1));
      main.appendChild(order);
      const name = el('span', 'name', it.file.name);
      main.appendChild(name);
      chip.appendChild(main);

      const right = el('span', 'meta', formatBytes(it.file.size));
      chip.appendChild(right);

      const rm = el('button', 'remove', '×');
      rm.addEventListener('click', () => {
        items = items.filter(x => x.id !== it.id);
        render();
        if (items.length === 0) optionsBox.style.display = 'none';
      });
      chip.appendChild(rm);

      chip.addEventListener('dragstart', () => { dragSrc = it.id; chip.classList.add('dragging'); });
      chip.addEventListener('dragend', () => chip.classList.remove('dragging'));
      chip.addEventListener('dragover', (e) => { e.preventDefault(); chip.classList.add('drag-over'); });
      chip.addEventListener('dragleave', () => chip.classList.remove('drag-over'));
      chip.addEventListener('drop', (e) => {
        e.preventDefault();
        chip.classList.remove('drag-over');
        if (!dragSrc || dragSrc === it.id) return;
        const fromIdx = items.findIndex(x => x.id === dragSrc);
        const toIdx = items.findIndex(x => x.id === it.id);
        const [moved] = items.splice(fromIdx, 1);
        items.splice(toIdx, 0, moved);
        render();
      });

      list.appendChild(chip);
    });
  }

  document.getElementById('runBtn').addEventListener('click', async () => {
    if (items.length < 2){ toast('Add at least two PDFs to merge', 'error'); return; }
    const btn = document.getElementById('runBtn');
    btn.disabled = true;
    document.getElementById('statusLine').textContent = 'Merging…';

    try {
      const { PDFDocument } = PDFLib;
      const outDoc = await PDFDocument.create();

      for (let i = 0; i < items.length; i++){
        setProgress(document.getElementById('progress'), Math.round((i / items.length) * 90));
        const bytes = await items[i].file.arrayBuffer();
        const srcDoc = await PDFDocument.load(bytes, { ignoreEncryption: true });
        const pages = await outDoc.copyPages(srcDoc, srcDoc.getPageIndices());
        pages.forEach(p => outDoc.addPage(p));
      }

      setProgress(document.getElementById('progress'), 100);
      const outBytes = await outDoc.save();
      resultBlob = new Blob([outBytes], { type: 'application/pdf' });

      document.getElementById('resultTitle').textContent = 'Merged';
      document.getElementById('resultMeta').textContent = `${items.length} files → ${outDoc.getPageCount()} pages · ${formatBytes(resultBlob.size)}`;
      document.getElementById('resultBox').classList.add('show');
      document.getElementById('statusLine').textContent = '';
    } catch (e){
      console.error(e);
      toast('Could not merge these files — one may be password protected', 'error');
      document.getElementById('statusLine').textContent = '';
    }
    btn.disabled = false;
  });

  document.getElementById('downloadBtn').addEventListener('click', () => {
    if (resultBlob) downloadBlob(resultBlob, 'merged.pdf');
  });
</script>
</body>
</html>
