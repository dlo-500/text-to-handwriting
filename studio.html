<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creator desk: paper text effects for video</title>
<style>
:root{--ink:#1d2433;--mat:#dce8df;--sheet:#fbf8f1;--crease:#b9c4bc;--accent:#2f5bea;--px:0;--py:0}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow:hidden;color:var(--ink);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--mat);
  background-image:linear-gradient(rgba(29,36,51,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(29,36,51,.07) 1px,transparent 1px);background-size:28px 28px}
.top{position:fixed;inset:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;padding:16px 24px;z-index:3}
.top strong{font:600 26px/1 "Iowan Old Style","Palatino Linotype",Georgia,serif}
.top a{color:var(--ink)}
.desk{position:fixed;inset:0;perspective:1300px;perspective-origin:50% 22%;overflow:auto;padding:90px 24px 120px}
.plane{display:flex;flex-wrap:wrap;justify-content:center;gap:56px 48px;max-width:1200px;margin:0 auto;transform-style:preserve-3d;
  transform:rotateX(calc(40deg + var(--py)*-4deg)) rotateZ(calc(var(--px)*2deg)) scale(.92);transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .6s}
.card{display:block;width:340px;max-width:100%;font:inherit;color:inherit;text-align:left;text-decoration:none;padding:12px 12px 14px;background:var(--sheet);border:0;border-radius:2px;cursor:pointer;
  box-shadow:0 1px 0 var(--crease),0 18px 30px -12px rgba(29,36,51,.45);transform:rotate(var(--r,0deg));transition:transform .25s,box-shadow .25s}
.card:nth-child(1){--r:-2.5deg}.card:nth-child(2){--r:1.8deg}.card:nth-child(3){--r:-1deg}.card:nth-child(4){--r:2.6deg}.card:nth-child(5){--r:-1.8deg}
.card:hover,.card:focus-visible{transform:translateZ(70px) rotate(0) scale(1.04);box-shadow:0 40px 50px -20px rgba(29,36,51,.55)}
.card canvas,.card svg{display:block;width:100%;aspect-ratio:16/9;background:#243044}
.card b{display:block;margin-top:10px;font:600 18px/1.2 "Iowan Old Style","Palatino Linotype",Georgia,serif}
.card span{display:block;font-size:13.5px;color:#4a5365;max-width:36ch}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
body.editing .plane{transform:rotateX(68deg) translateY(-25%) scale(.7);opacity:.35;pointer-events:none}
.editor{position:fixed;inset:60px 3vw 3vh;z-index:4;display:grid;grid-template-columns:1fr 330px;background:var(--sheet);border:1px solid var(--ink);
  box-shadow:0 30px 80px rgba(29,36,51,.5);transform:translateY(115%) rotateX(14deg);transform-origin:50% 100%;transition:transform .75s cubic-bezier(.2,.9,.2,1);visibility:hidden}
body.editing .editor{transform:none;visibility:visible}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;min-width:0;background:var(--mat)}
.stage canvas{max-width:100%;max-height:calc(100vh - 220px);border:1px solid var(--ink)}
.bar{display:flex;gap:12px;align-items:center;width:min(100%,560px)}.bar input{flex:1}
.panel{padding:20px;overflow:auto;border-left:1px solid var(--crease)}
.panel h2{margin-top:16px;font:600 24px/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif;margin-bottom:12px}
.row{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:8px;margin:7px 0}
fieldset{border:0;border-top:1px solid var(--crease);margin:16px 0 0;padding:14px 0 0}
select,button,input[type=text]{font:inherit;color:inherit;border:1px solid var(--ink);background:#fff;padding:6px 10px;border-radius:3px;min-width:0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button:disabled{opacity:.5}
progress{width:100%;height:8px}#msg{min-height:3em;font-size:14px;margin:10px 0 0}
@media(max-width:900px){.editor{grid-template-columns:1fr;overflow:auto}.panel{border-left:0;border-top:1px solid var(--crease)}}
@media(prefers-reduced-motion:reduce){.plane,.editor,.card{transition:none}}
</style>
<body>
<header class="top"><strong>Creator desk</strong><a href="index.html">Paper unfold</a></header>
<div class="desk"><div class="plane" id="plane"></div></div>
<section class="editor" id="ed" aria-label="Effect editor">
  <div class="stage"><canvas id="cv" width="540" height="960"></canvas>
    <div class="bar"><button id="play">Pause</button><input id="scrub" type="range" min="0" max="1" step="0.001" aria-label="Timeline"><output id="clock">0.0s</output></div></div>
  <div class="panel"><button id="back">Back to desk</button><h2 id="ttl"></h2><div id="ctl"></div>
    <label class="row">Background<select id="key"><option value="#00ff00">Green</option><option value="#0000ff">Blue</option><option value="#ff00ff">Magenta</option></select></label>
    <fieldset>
      <label class="row">Size<select id="size"><option value="v">1080 x 1920 vertical</option><option value="l">1920 x 1080 wide</option><option value="s">1080 x 1080 square</option></select></label>
      <label class="row">Frame rate<select id="fps"><option>30</option><option>60</option></select></label>
      <button id="go" class="primary">Export MP4</button> <button id="stop" hidden>Cancel</button><progress id="prog" value="0" max="1" hidden></progress>
      <p id="msg" role="status" aria-live="polite"></p></fieldset></div>
</section>
<script type="module">
import { Renderer2D, exportVideo } from './src/engine.js';
import { textEffects } from './src/effects/text-effects.js';
const $ = id => document.getElementById(id), SIZES = { v: [1080, 1920], l: [1920, 1080], s: [1080, 1080] };
const still = matchMedia('(prefers-reduced-motion: reduce)').matches, say = s => ($('msg').textContent = s);
const tiles = textEffects.map(fx => {
  const b = document.createElement('button'); b.className = 'card'; b.setAttribute('aria-label', 'Open ' + fx.title);
  b.innerHTML = `<canvas width="480" height="270"></canvas><b>${fx.title}</b><span>${fx.blurb}</span>`; $('plane').append(b);
  const r = new Renderer2D(b.querySelector('canvas')); r.setEffect(fx); b.onclick = () => open(fx);
  return { r, fx, p: { ...fx.defaults, key: '#243044' } };
});
$('plane').insertAdjacentHTML('beforeend', `<a class="card" href="index.html"><svg viewBox="0 0 160 90"><g fill="#f1ecdf" stroke="#b9c4bc"><path d="M30 20l22 8v44l-22-8z"/><path d="M52 28l24-8v44l-24 8z" fill="#e5dfcf"/><path d="M76 20l24 8v44l-24-8z"/><path d="M100 28l30-8v44l-30 8z" fill="#e5dfcf"/></g></svg><b>Paper unfold</b><span>An image on a sheet that unfolds, exported over a keyable background.</span></a>`);
addEventListener('pointermove', e => { if (still) return; document.documentElement.style.setProperty('--px', e.clientX / innerWidth - .5); document.documentElement.style.setProperty('--py', e.clientY / innerHeight - .5); });

let R, fx, P, playing = true, T = 0, t0 = 0, dirty = true, last = 0, ac;
const fit = () => { const [w, h] = SIZES[$('size').value]; R.resize(w / 2, h / 2); dirty = true; };
function open(f) {
  fx = f; P = { ...f.defaults }; R ||= new Renderer2D($('cv')); R.setEffect(f); $('ttl').textContent = f.title; $('key').value = P.key; say('');
  $('ctl').replaceChildren();
  for (const [k, label, a, b, c] of f.ui) {
    const row = document.createElement('label'); row.className = 'row'; let el;
    if (a === 'text') el = Object.assign(document.createElement('input'), { type: 'text', value: P[k], maxLength: 80 });
    else if (Array.isArray(a)) { el = document.createElement('select'); a.forEach(o => el.add(new Option(o, o))); el.value = P[k]; }
    else el = Object.assign(document.createElement('input'), { type: 'range', min: a, max: b, step: c, value: P[k] });
    el.oninput = () => { P[k] = a === 'text' || isNaN(+el.value) ? el.value : +el.value; dirty = true; };
    row.append(label, el); $('ctl').append(row);
  }
  playing = !still; $('play').textContent = playing ? 'Pause' : 'Play'; T = still ? f.duration(P) * .8 : 0; t0 = performance.now();
  fit(); document.body.classList.add('editing'); $('back').focus();
}
const close = () => { document.body.classList.remove('editing'); ac?.abort(); };
$('back').onclick = close; addEventListener('keydown', e => e.key === 'Escape' && close());
$('key').onchange = e => { P.key = e.target.value; dirty = true; }; $('size').onchange = fit;
$('play').onclick = () => { playing = !playing; t0 = performance.now() - T * 1000; $('play').textContent = playing ? 'Pause' : 'Play'; };
$('scrub').oninput = e => { playing = false; $('play').textContent = 'Play'; T = e.target.value * fx.duration(P); dirty = true; };

(function frame(now) {
  if (document.body.classList.contains('editing')) {
    const d = fx.duration(P);
    if (playing) { T = ((now - t0) / 1000) % d; $('scrub').value = T / d; dirty = true; }
    if (dirty) { R.render(T, P); $('clock').textContent = T.toFixed(1) + 's'; dirty = false; }
  } else if (now - last > 33 || (still && !last)) {
    last = now; for (const { r, fx, p } of tiles) r.render(still ? fx.duration(p) * .8 : (now / 1000) % fx.duration(p), p);
  }
  requestAnimationFrame(frame);
})(performance.now());

const busy = b => { $('go').disabled = b; $('stop').hidden = !b; $('prog').hidden = !b; $('back').disabled = b; };
$('stop').onclick = () => ac?.abort();
$('go').onclick = async () => {
  const [w, h] = SIZES[$('size').value]; ac = new AbortController(); busy(true); say('Exporting. Keep this tab open.');
  try {
    const blob = await exportVideo(R, P, { fps: +$('fps').value, w, h, signal: ac.signal, onProgress: x => ($('prog').value = x) });
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: fx.id + '.' + (blob.type.includes('webm') ? 'webm' : 'mp4') });
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 6e4); say('Saved. Place it above your footage and key out the background color.');
  } catch (e) { say(e.name === 'AbortError' ? 'Export cancelled.' : 'Export failed: ' + e.message); }
  finally { busy(false); fit(); }
};
</script>
